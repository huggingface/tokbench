[workspace]
resolver = "2"
# Listed explicitly rather than `engines/*`: three engine folders
# (minbpe, mistral-common, ai-tokenizer) hold a script, not a crate, because
# they are benchmarked by re-running the protocol inside their own runtime.
members = [
    "core",
    "driver",
    "binsize",
    "engines/hf-tokenizers",
    "engines/pipeline",
    "engines/kitoken",
    "engines/splintr",
    "engines/fastokens",
    "engines/tokie",
    "engines/tiktoken",
    "engines/rust-gems-bpe",
    "engines/wordchipper",
    "engines/sentencepiece",
    "engines/blingfire",
    "engines/gigatoken",
    "engines/llamacpp",
    "engines/iree",
    "engines/executorch",
]

# Benchmark numbers are only comparable if every engine is compiled the same
# way. These settings apply to every member, so no engine can win on profile
# flags. `lto = "fat"` + `codegen-units = 1` is what a release consumer of these
# libraries would ship; `debug = 1` keeps `perf`/Instruments symbols without
# affecting codegen.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1
# Unwinding, NOT abort. The driver runs third-party code over adversarial
# inputs, and some of it panics (tokie 0.1.4 indexes out of bounds on a
# truncated vocabulary). With `panic = "abort"` one bad engine takes the whole
# matrix down and 79 good cells are lost; with unwind the driver catches it,
# records "panicked" for that cell, and carries on. A benchmark harness has to
# survive the thing it is benchmarking.

# The size probe ships the flags a real minimal build would use — matching
# tokenizers#2293's methodology (opt-level=z, panic=abort, cgu=1, lto=fat,
# stripped) so the numbers are comparable with the ones quoted there.
[profile.binsize]
inherits = "release"
opt-level = "z"
panic = "abort"
strip = true
debug = 0

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/huggingface/tokbench"

[workspace.dependencies]
tokbench-core = { path = "core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
