[workspace]
resolver = "2"
members = [
    "core",
    "driver",
    "binsize",
    "engines/hf-tokenizers",
    "engines/pipeline",
    "engines/kitoken",
    "engines/fastokens",
    "engines/tokie",
    "engines/tiktoken",
    "engines/rust-gems-bpe",
    "engines/wordchipper",
    "engines/sentencepiece",
    "engines/gigatoken",
    "engines/llamacpp",
    "engines/iree",
    "engines/executorch",
]

# One profile for every member, so no engine can win on compile flags.
# `panic = "unwind"` is load-bearing: the driver catches a panicking engine and
# records the cell as failed instead of losing the whole matrix.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1

# What a minimal release consumer would ship, for the binary-size probe.
[profile.binsize]
inherits = "release"
opt-level = "z"
panic = "abort"
strip = true
debug = 0

# The tokenizers crate decomposition uses these upstream profile names.
[profile.minsize]
inherits = "release"
opt-level = "z"
panic = "abort"
strip = true
debug = 0

[profile.slimest]
inherits = "minsize"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/huggingface/tokbench"

[workspace.dependencies]
tokbench-core = { path = "core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
