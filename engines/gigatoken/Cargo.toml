[package]
name = "tokbench-gigatoken"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "tokbench engine: gigatoken."

# The dependency stays commented out because Cargo parses a git dependency's
# manifest during resolution, and gigatoken's sets `rustflags` under an
# unstable profile key — declaring it at all makes `cargo metadata` fail for
# every crate in this workspace, feature-gated or not. To wire it up, uncomment
# the line below and build with all three:
#
#     RUSTFLAGS="--cfg gigatoken_wired" \
#     cargo +nightly -Z profile-rustflags build --release -p tokbench \
#           --features gigatoken
#
# nightly for `portable_simd`; `-Z profile-rustflags` to parse the manifest.
# The link pulls libpython (pyo3 is non-optional upstream), so the binary is
# not relocatable. `hf-jobs/prepare_gigatoken.py` does all of this in CI.
[dependencies]
tokbench-core.workspace = true
# gigatoken_rs = { package = "gigatoken", git = "https://github.com/marcelroed/gigatoken", rev = "34a1599f0c0ae7d7cd0d1c530e6522320158b360" }

# Sizes the pool gigatoken's own `encode_docs_ragged` fans out over.
rayon = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(gigatoken_wired)'] }
