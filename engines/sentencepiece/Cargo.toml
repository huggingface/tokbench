[package]
name = "tokbench-sentencepiece"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "tokbench engine: Google SentencePiece via the sentencepiece crate."

[dependencies]
tokbench-core.workspace = true

# `static` vendors and builds libsentencepiece from source, so a CI runner
# needs no system package and every machine measures the same C++ build rather
# than whatever the distro happens to ship.
sentencepiece = { version = "=0.14.0", features = ["static"] }
