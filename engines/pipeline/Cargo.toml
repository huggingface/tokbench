[package]
name = "tokbench-pipeline"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "tokbench engine: the HuggingFace target encode path (tokenizers PR #2308, tk-encode)."

[dependencies]
tokbench-core.workspace = true

# PR #2308 — "perf(bpe): wire the word cache into the batched model path, fused",
# which is #2306 (batched model) + the cache in `tokenize_spans` + the fused
# `probe_emit`, on top of #2119 (`feat/train_encode_split`).
#
# A path dep on a local WORKTREE, not a tag: the PR is open and still moving.
# That tracks the work in progress, which is the point, but it also means two
# runs a week apart are not necessarily the same code. Check out an exact rev in
# that worktree before quoting any number from this engine anywhere durable.
#
# The worktree lives under ~/Work, deliberately NOT under /tmp: a stale /tmp
# checkout on some other branch is exactly how a previous run recorded numbers
# for `perf/cache-probe-window` while the engine string still claimed #2279.
# `Engine::info().version` below carries the branch and short rev; trust that
# over any comment here, and re-check it whenever a number looks surprising.
#
# tk-encode is edition 2024, so this engine needs a recent toolchain; the rest
# of the workspace does not.
tk-encode = { git = "https://github.com/huggingface/tokenizers", rev = "795f9222", package = "tk-encode", features = ["fancy-regex"] }
