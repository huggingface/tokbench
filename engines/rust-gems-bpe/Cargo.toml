[package]
name = "tokbench-rust-gems-bpe"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "tokbench engine: GitHub rust-gems `bpe` — linear-time backtracking byte-pair encoding."

[dependencies]
tokbench-core.workspace = true

# `bpe` is the merge kernel with no pre-tokenizer; `bpe-openai` is the kernel
# plus the OpenAI split regex, which is what can actually be compared
# id-for-id against the reference. Both are linked so the engine can report
# whichever configuration the model supports.
bpe = "=0.2.1"
bpe-openai = "=0.3.0"
