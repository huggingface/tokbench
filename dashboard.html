<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>tokbench — tokenizer benchmark dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
  :root{
    --bg:#0b0d10; --panel:#12151a; --panel-2:#171b22; --line:#232935;
    --fg:#e6e9ef; --muted:#8b95a7; --dim:#5b6577;
    --accent:#5b8cff; --ok:#3ddc97; --warn:#ffb020; --bad:#ff5c5c;
    --c1:#5b8cff; --c2:#3ddc97; --c3:#ffb020; --c4:#c77dff; --c5:#ff7ab6;
    --radius:12px; --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent)}
  .wrap{max-width:1400px; margin:0 auto; padding:24px 20px 64px}
  header{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:4px}
  h1{font-size:20px; margin:0; letter-spacing:-.01em}
  .sub{color:var(--muted); font-size:13px}
  .panel{
    background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius); padding:16px;
  }
  .panel h2{
    font-size:13px; text-transform:uppercase; letter-spacing:.06em;
    color:var(--muted); margin:0 0 2px; font-weight:600;
  }
  .panel .hint{color:var(--dim); font-size:12px; margin:0 0 12px}

  /* drop zone */
  #drop{
    margin:18px 0; padding:20px; border:1.5px dashed var(--line);
    border-radius:var(--radius); background:var(--panel);
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    transition:border-color .15s, background .15s;
  }
  #drop.hot{border-color:var(--accent); background:#141a26}
  #drop .big{font-weight:600}
  #drop .muted{color:var(--muted); font-size:13px}
  .spacer{flex:1}
  button,select{
    background:var(--panel-2); color:var(--fg); border:1px solid var(--line);
    border-radius:8px; padding:8px 12px; font-size:13px; cursor:pointer;
    font-family:inherit;
  }
  button:hover,select:hover{border-color:var(--accent)}

  .grid{display:grid; gap:16px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); margin-bottom:16px}
  .kpi .label{color:var(--muted); font-size:12px}
  .kpi .value{font-size:22px; font-weight:650; font-variant-numeric:tabular-nums; margin-top:2px}
  .kpi .note{color:var(--dim); font-size:11px; margin-top:2px}

  .charts{grid-template-columns:1fr; margin-bottom:16px}
  @media(min-width:1080px){ .charts.two{grid-template-columns:1fr 1fr} }
  .chart{width:100%; height:420px}
  .chart.tall{height:460px}

  /* table */
  .tablewrap{overflow-x:auto}
  table{border-collapse:collapse; width:100%; font-size:13px; min-width:900px}
  th,td{text-align:right; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap}
  th:first-child,td:first-child{text-align:left; position:sticky; left:0; background:var(--panel)}
  th{color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.05em}
  td.num{font-variant-numeric:tabular-nums; font-family:var(--mono)}
  tbody tr:hover td{background:var(--panel-2)}
  tbody tr:hover td:first-child{background:var(--panel-2)}

  .badge{
    display:inline-block; padding:1px 7px; border-radius:999px;
    font-size:11px; font-weight:600; border:1px solid transparent;
  }
  .b-ok{color:var(--ok); background:rgba(61,220,151,.10); border-color:rgba(61,220,151,.25)}
  .b-bad{color:var(--bad); background:rgba(255,92,92,.10); border-color:rgba(255,92,92,.25)}
  .b-warn{color:var(--warn); background:rgba(255,176,32,.10); border-color:rgba(255,176,32,.25)}
  .b-dim{color:var(--muted); background:rgba(139,149,167,.10); border-color:rgba(139,149,167,.22)}
  .eng{display:flex; align-items:center; gap:8px}
  .eng .nm{font-weight:600}
  .note-line{color:var(--dim); font-size:11px; margin-top:2px; white-space:normal; max-width:340px}

  .notice{
    border-left:3px solid var(--warn); background:rgba(255,176,32,.06);
    padding:10px 14px; border-radius:0 8px 8px 0; color:#e8d6b0;
    font-size:13px; margin-bottom:16px;
  }
  .notice.bad{border-color:var(--bad); background:rgba(255,92,92,.06); color:#f0c8c8}
  .notice b{color:#fff}
  .empty{color:var(--muted); text-align:center; padding:50px 20px}
  code{font-family:var(--mono); font-size:12px; color:#b9c4d8}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>tokbench</h1>
    <span class="sub">tokenizer engines · one timing loop · verified ids</span>
    <div class="spacer"></div>
    <select id="runsel" style="display:none"></select>
    <button id="demo">Load sample data</button>
  </header>

  <div id="drop">
    <div>
      <div class="big">Drop <code>tokenizer_bench_results.json</code> here</div>
      <div class="muted">…or <label style="color:var(--accent);cursor:pointer;text-decoration:underline">browse<input id="file" type="file" accept=".json,application/json" hidden></label>. Nothing is uploaded — parsing happens in this page.</div>
    </div>
    <div class="spacer"></div>
    <div class="muted" id="loaded">no data loaded</div>
  </div>

  <div id="app"><div class="empty">Drop a results file, or click <b>Load sample data</b> to see the layout.</div></div>
</div>

<script>
/* ---------------------------------------------------------------------------
   tokbench dashboard.

   Reads the JSON written by the Rust driver. The schema carries more than
   speed: an engine's `verified` flag, its execution `engine_class`, whether it
   parallelises internally, and what extra work it does on the same pass. The
   charts below refuse to rank engines on speed alone, because a fast engine
   that produced different token ids did not do the same job.

   Derived metrics (computed here, not trusted from the file):
     tok/S = total_tokens_produced / mean_execution_time_seconds
     ns/B  = mean_execution_time_seconds * 1e9 / file_size_bytes
--------------------------------------------------------------------------- */

const $ = (s) => document.querySelector(s);
const PHASES = [
  ["normalization",    "Normalization",    "var(--c1)"],
  ["pre_tokenization", "Pre-tokenization", "var(--c2)"],
  ["core_encoding",    "Core encoding",    "var(--c3)"],
  ["post_processing",  "Post-processing",  "var(--c4)"],
];
const PHASE_COLORS = ["#5b8cff", "#3ddc97", "#ffb020", "#c77dff"];

/* ---- formatting ---------------------------------------------------------- */
function fmtCount(n) {
  if (!isFinite(n) || n <= 0) return "—";
  if (n >= 1e9) return (n / 1e9).toFixed(2) + "B";
  if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1) + "k";
  return n.toFixed(0);
}
function fmtTok(n){ return fmtCount(n) + " tok/S"; }
function fmtNsB(n){ return !isFinite(n)||n<=0 ? "—" : n.toFixed(2) + " ns/B"; }
function fmtDur(ns) {
  if (!isFinite(ns) || ns <= 0) return "—";
  if (ns >= 1e9) return (ns / 1e9).toFixed(2) + "s";
  if (ns >= 1e6) return (ns / 1e6).toFixed(1) + "ms";
  if (ns >= 1e3) return (ns / 1e3).toFixed(0) + "µs";
  return ns.toFixed(0) + "ns";
}
function fmtKB(kb) {
  if (kb == null || !isFinite(kb)) return "—";
  return kb >= 1024 ? (kb / 1024).toFixed(1) + " MB" : kb.toFixed(0) + " kB";
}
function fmtMB(mb){ return mb == null || !isFinite(mb) ? "—" : mb.toFixed(1) + " MB"; }
function esc(s){ return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---- derive -------------------------------------------------------------- */
function derive(run) {
  const bytes = run.dataset_metadata?.file_size_bytes || 0;
  return (run.results || []).map(r => {
    const secs = r.mean_execution_time_seconds || 0;
    const b = r.breakdown_nanoseconds;
    const phaseTotal = b ? PHASES.reduce((s, [k]) => s + (b[k] || 0), 0) : 0;
    return {
      ...r,
      ok: !r.unsupported,
      tokps: secs > 0 ? r.total_tokens_produced / secs : 0,
      // Prefer the driver's own ns/B when present; recompute otherwise so the
      // dashboard still works on a hand-written file.
      nsb: r.ns_per_byte != null && isFinite(r.ns_per_byte)
             ? r.ns_per_byte
             : (bytes > 0 && secs > 0 ? secs * 1e9 / bytes : 0),
      phases: b || null,
      phaseTotal,
    };
  });
}

/* ---- charts -------------------------------------------------------------- */
const AXIS = { axisLine:{lineStyle:{color:"#232935"}}, axisLabel:{color:"#8b95a7"},
               splitLine:{lineStyle:{color:"#1a1f28"}} };
const TOOLTIP = {
  backgroundColor:"#171b22", borderColor:"#232935", borderWidth:1,
  textStyle:{color:"#e6e9ef", fontSize:12}, padding:[8,10],
};

let charts = [];
function mkChart(el, option) {
  const c = echarts.init(el, null, { renderer: "canvas" });
  c.setOption(option);
  charts.push(c);
  return c;
}
window.addEventListener("resize", () => charts.forEach(c => c.resize()));

/* Grouped bar: throughput and efficiency side by side.
   Two y-axes because tok/S is ~1e6 and ns/B is ~1e0; a shared axis would
   flatten one series into the baseline and make it unreadable. */
function chartSpeed(el, rows) {
  const r = rows.filter(x => x.ok && x.tokps > 0)
                .sort((a, b) => b.tokps - a.tokps);
  mkChart(el, {
    grid:{left:8, right:8, top:44, bottom:8, containLabel:true},
    legend:{ data:["Tokens / second","ns per byte"], textStyle:{color:"#8b95a7"},
             top:0, itemWidth:12, itemHeight:12 },
    tooltip:{ ...TOOLTIP, trigger:"axis", axisPointer:{type:"shadow"},
      formatter(ps){
        const row = r[ps[0].dataIndex];
        const flag = row.verified === false
          ? '<div style="color:#ff5c5c;margin-top:4px">⚠ ids differ from reference — not comparable</div>' : "";
        const par = row.internally_parallel
          ? '<div style="color:#ffb020;margin-top:2px">⚠ multi-threaded internally</div>' : "";
        const extra = row.also_computes
          ? `<div style="color:#8b95a7;margin-top:2px">also computes: ${esc(row.also_computes)}</div>` : "";
        return `<b>${esc(row.tokenizer_name)}</b> <span style="color:#5b6577">${esc(row.engine_version||"")}</span><br>
          ${fmtTok(row.tokps)}<br>${fmtNsB(row.nsb)}<br>
          <span style="color:#8b95a7">${fmtCount(row.total_tokens_produced)} tokens in ${fmtDur(row.mean_execution_time_seconds*1e9)}</span>
          ${extra}${par}${flag}`;
      }},
    xAxis:{ type:"category", data:r.map(x => x.tokenizer_name), ...AXIS,
            axisLabel:{...AXIS.axisLabel, rotate: r.length > 6 ? 28 : 0} },
    yAxis:[
      { type:"value", name:"tok/S", nameTextStyle:{color:"#8b95a7"}, ...AXIS,
        axisLabel:{...AXIS.axisLabel, formatter:(v)=>fmtCount(v)} },
      { type:"value", name:"ns/B", nameTextStyle:{color:"#8b95a7"}, ...AXIS,
        splitLine:{show:false} },
    ],
    series:[
      { name:"Tokens / second", type:"bar", yAxisIndex:0, data:r.map(x=>x.tokps),
        itemStyle:{ color:"#5b8cff", borderRadius:[3,3,0,0] }, barMaxWidth:38 },
      { name:"ns per byte", type:"bar", yAxisIndex:1, data:r.map(x=>x.nsb),
        itemStyle:{ color:"#3ddc97", borderRadius:[3,3,0,0] }, barMaxWidth:38 },
    ],
  });
}

/* 100% stacked horizontal: where the time actually goes.
   Percentages, so a slow engine and a fast one can be compared on *shape*.
   Absolute nanoseconds are in the tooltip, because shape alone would hide
   that one bar is 100x the other. */
function chartPhases(el, rows) {
  const r = rows.filter(x => x.ok && x.phases && x.phaseTotal > 0);
  if (!r.length) {
    el.innerHTML = '<div class="empty">No engine in this run reports a phase breakdown.<br>'
      + '<span style="font-size:12px">Only engines whose API exposes stages separately are instrumented; '
      + 'the rest are left blank rather than given an invented split.</span></div>';
    return;
  }
  const names = r.map(x => x.tokenizer_name);
  mkChart(el, {
    grid:{left:8, right:24, top:44, bottom:8, containLabel:true},
    legend:{ data:PHASES.map(p=>p[1]), textStyle:{color:"#8b95a7"}, top:0,
             itemWidth:12, itemHeight:12 },
    tooltip:{ ...TOOLTIP, trigger:"axis", axisPointer:{type:"shadow"},
      formatter(ps){
        const row = r[ps[0].dataIndex];
        const lines = PHASES.map(([k,label],i)=>{
          const ns = row.phases[k] || 0;
          const pct = row.phaseTotal ? (ns/row.phaseTotal*100) : 0;
          return `<div><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${PHASE_COLORS[i]};margin-right:6px"></span>
            ${label}: <b>${pct.toFixed(1)}%</b> <span style="color:#8b95a7">(${fmtDur(ns)})</span></div>`;
        }).join("");
        return `<b>${esc(row.tokenizer_name)}</b><br>${lines}
          <div style="color:#8b95a7;margin-top:4px">total ${fmtDur(row.phaseTotal)}</div>`;
      }},
    xAxis:{ type:"value", max:100, ...AXIS, axisLabel:{...AXIS.axisLabel, formatter:"{value}%"} },
    yAxis:{ type:"category", data:names, ...AXIS, splitLine:{show:false} },
    series: PHASES.map(([k,label], i) => ({
      name:label, type:"bar", stack:"t",
      data: r.map(x => x.phaseTotal ? (x.phases[k]||0)/x.phaseTotal*100 : 0),
      itemStyle:{ color: PHASE_COLORS[i] }, barMaxWidth:26,
    })),
  });
}

/* Footprint: package size (what you download) and resident memory (what you
   hold). Log x-axis — the package sizes span four orders of magnitude, and a
   linear axis would collapse everything under 1 MB into the origin. */
function chartFootprint(el, rows) {
  const r = rows.filter(x => x.ok && (x.crate_size_kb != null || x.rss_delta_mb != null));
  if (!r.length) {
    el.innerHTML = '<div class="empty">No footprint data.<br><span style="font-size:12px">'
      + 'Run <code>scripts/package_size.py</code> and re-run the driver without <code>--no-memory</code>.</span></div>';
    return;
  }
  const sorted = [...r].sort((a,b)=>(b.crate_size_kb||0)-(a.crate_size_kb||0));
  mkChart(el, {
    grid:{left:8, right:24, top:44, bottom:8, containLabel:true},
    legend:{ data:["Package size","Resident memory"], textStyle:{color:"#8b95a7"}, top:0,
             itemWidth:12, itemHeight:12 },
    tooltip:{ ...TOOLTIP, trigger:"axis", axisPointer:{type:"shadow"},
      formatter(ps){
        const row = sorted[ps[0].dataIndex];
        const peak = row.rss_peak_mb != null
          ? `<div style="color:#8b95a7">peak RSS: ${fmtMB(row.rss_peak_mb)}</div>` : "";
        const bin = row.binary_delta_kb != null
          ? `<div style="color:#8b95a7">adds to binary: ${fmtKB(row.binary_delta_kb)}</div>` : "";
        return `<b>${esc(row.tokenizer_name)}</b><br>
          package: <b>${fmtKB(row.crate_size_kb)}</b>
          <span style="color:#5b6577">${esc(row.package_ref||"")}</span><br>
          resident: <b>${fmtMB(row.rss_delta_mb)}</b>${peak}${bin}`;
      }},
    xAxis:[
      { type:"value", name:"package kB", nameTextStyle:{color:"#8b95a7"}, ...AXIS,
        axisLabel:{...AXIS.axisLabel, formatter:(v)=>fmtCount(v)} },
      { type:"value", name:"RSS MB", nameTextStyle:{color:"#8b95a7"}, ...AXIS,
        splitLine:{show:false} },
    ],
    yAxis:{ type:"category", data:sorted.map(x=>x.tokenizer_name), ...AXIS, splitLine:{show:false} },
    series:[
      { name:"Package size", type:"bar", xAxisIndex:0,
        data:sorted.map(x=>x.crate_size_kb ?? 0),
        itemStyle:{color:"#c77dff", borderRadius:[0,3,3,0]}, barMaxWidth:16 },
      { name:"Resident memory", type:"bar", xAxisIndex:1,
        data:sorted.map(x=>x.rss_delta_mb ?? 0),
        itemStyle:{color:"#ff7ab6", borderRadius:[0,3,3,0]}, barMaxWidth:16 },
    ],
  });
}

/* ---- render -------------------------------------------------------------- */
let DATA = null;

function runsOf(d) {
  if (Array.isArray(d?.runs) && d.runs.length) return d.runs;
  if (d?.results) return [{ dataset_metadata: d.dataset_metadata || {}, results: d.results }];
  return [];
}

function render(runIdx = 0) {
  charts.forEach(c => c.dispose());
  charts = [];
  const runs = runsOf(DATA);
  if (!runs.length) {
    $("#app").innerHTML = '<div class="empty">That file has no <code>results</code> array.</div>';
    return;
  }
  const run = runs[Math.min(runIdx, runs.length - 1)];
  const meta = run.dataset_metadata || {};
  const rows = derive(run);
  const ok = rows.filter(r => r.ok);
  const unsup = rows.filter(r => !r.ok);
  const mism = ok.filter(r => r.verified === false);
  const unver = ok.filter(r => r.verified == null);
  const fastest = ok.filter(r => r.verified !== false).sort((a,b)=>b.tokps-a.tokps)[0];

  // run selector
  const sel = $("#runsel");
  if (runs.length > 1) {
    sel.style.display = "";
    sel.innerHTML = runs.map((r,i) => {
      const m = r.dataset_metadata || {};
      return `<option value="${i}" ${i===runIdx?"selected":""}>${esc(m.model||"model")} · ${esc(m.corpus||"corpus")}</option>`;
    }).join("");
    sel.onchange = () => render(+sel.value);
  } else sel.style.display = "none";

  const warn = [];
  if (mism.length) warn.push(`<div class="notice bad"><b>${mism.length} engine(s) produced different token ids</b> than the reference
    (${mism.map(r=>esc(r.tokenizer_name)).join(", ")}). They did not compute the same function, so their speed is not comparable — shown, but never ranked.</div>`);
  if (unver.length === ok.length && ok.length)
    warn.push(`<div class="notice">No reference engine in this run, so <b>nothing could be verified</b>. Treat every number as unconfirmed.</div>`);
  const par = ok.filter(r=>r.internally_parallel);
  if (par.length) warn.push(`<div class="notice"><b>${par.map(r=>esc(r.tokenizer_name)).join(", ")}</b> parallelise internally: those are whole-machine numbers next to single-thread ones.</div>`);

  $("#app").innerHTML = `
    ${warn.join("")}
    <div class="grid kpis">
      <div class="panel kpi"><div class="label">Corpus</div>
        <div class="value">${fmtKB((meta.file_size_bytes||0)/1024)}</div>
        <div class="note">${esc(meta.corpus||"—")} · ${fmtCount(meta.total_characters||0)} chars</div></div>
      <div class="panel kpi"><div class="label">Model</div>
        <div class="value" style="font-size:17px">${esc(meta.model||"—")}</div>
        <div class="note">${meta.reps?`median of ${meta.reps} passes`:""}${meta.warmup===false?" · cold cache":" · warm cache"}</div></div>
      <div class="panel kpi"><div class="label">Engines measured</div>
        <div class="value">${ok.length}</div>
        <div class="note">${unsup.length} unsupported${mism.length?` · ${mism.length} mismatched`:""}</div></div>
      <div class="panel kpi"><div class="label">Fastest verified</div>
        <div class="value" style="font-size:17px">${fastest?esc(fastest.tokenizer_name):"—"}</div>
        <div class="note">${fastest?fmtTok(fastest.tokps):""}</div></div>
    </div>

    <div class="grid charts">
      <div class="panel">
        <h2>Throughput and efficiency</h2>
        <p class="hint">Tokens per second (higher is better) against nanoseconds per byte (lower is better), on separate axes. Sorted by throughput.</p>
        <div id="c-speed" class="chart"></div>
      </div>
    </div>

    <div class="grid charts two">
      <div class="panel">
        <h2>Where the time goes</h2>
        <p class="hint">Share of encode time per stage. Pre-tokenization is broken out separately — it is often the real bottleneck.</p>
        <div id="c-phase" class="chart tall"></div>
      </div>
      <div class="panel">
        <h2>Footprint</h2>
        <p class="hint">Published package size versus resident memory once loaded and warmed.</p>
        <div id="c-foot" class="chart tall"></div>
      </div>
    </div>

    <div class="panel">
      <h2>All engines</h2>
      <p class="hint">Every measured cell, including the ones that could not run.</p>
      <div class="tablewrap"><table>
        <thead><tr>
          <th>Engine</th><th>tok/S</th><th>ns/B</th><th>Tokens</th><th>Time</th>
          <th>Load</th><th>RSS</th><th>Package</th><th>Class</th><th>IDs</th>
        </tr></thead>
        <tbody>${rows.map(rowHtml).join("")}</tbody>
      </table></div>
    </div>`;

  chartSpeed($("#c-speed"), rows);
  chartPhases($("#c-phase"), rows);
  chartFootprint($("#c-foot"), rows);
}

function rowHtml(r) {
  if (!r.ok) return `<tr>
    <td><div class="eng"><span class="nm" style="color:var(--muted)">${esc(r.tokenizer_name)}</span>
      <span class="badge b-dim">unsupported</span></div>
      <div class="note-line">${esc(r.unsupported)}</div></td>
    <td colspan="9" style="color:var(--dim)">did not run</td></tr>`;

  const idbadge = r.verified === true  ? '<span class="badge b-ok">match</span>'
                : r.verified === false ? '<span class="badge b-bad">differ</span>'
                : '<span class="badge b-dim">unverified</span>';
  const cls = r.engine_class === "native" ? "b-ok"
            : r.engine_class === "subprocess" ? "b-warn" : "b-dim";
  const notes = [
    r.also_computes ? `also computes ${esc(r.also_computes)}` : "",
    r.internally_parallel ? "multi-threaded internally" : "",
    r.package_ref ? esc(r.package_ref) : "",
  ].filter(Boolean).join(" · ");

  return `<tr>
    <td><div class="eng"><span class="nm">${esc(r.tokenizer_name)}</span>
      <span style="color:var(--dim);font-size:11px">${esc(r.engine_lang||"")}</span></div>
      ${notes?`<div class="note-line">${notes}</div>`:""}</td>
    <td class="num">${fmtCount(r.tokps)}</td>
    <td class="num">${r.nsb?r.nsb.toFixed(2):"—"}</td>
    <td class="num">${fmtCount(r.total_tokens_produced)}</td>
    <td class="num">${fmtDur(r.mean_execution_time_seconds*1e9)}</td>
    <td class="num">${r.load_ms!=null?r.load_ms.toFixed(0)+" ms":"—"}</td>
    <td class="num">${fmtMB(r.rss_delta_mb)}</td>
    <td class="num">${fmtKB(r.crate_size_kb)}</td>
    <td><span class="badge ${cls}">${esc(r.engine_class||"?")}</span></td>
    <td>${idbadge}</td></tr>`;
}

/* ---- input --------------------------------------------------------------- */
function load(obj, label) {
  DATA = obj;
  $("#loaded").textContent = label;
  render(0);
}
function readFile(f) {
  const rd = new FileReader();
  rd.onload = () => {
    try { load(JSON.parse(rd.result), `${f.name} · ${(f.size/1024).toFixed(0)} kB`); }
    catch (e) { $("#app").innerHTML = `<div class="notice bad">Could not parse <b>${esc(f.name)}</b>: ${esc(e.message)}</div>`; }
  };
  rd.readAsText(f);
}
const drop = $("#drop");
["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.add("hot");
}));
["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.remove("hot");
}));
drop.addEventListener("drop", e => {
  const f = e.dataTransfer.files?.[0];
  if (f) readFile(f);
});
$("#file").addEventListener("change", e => { if (e.target.files[0]) readFile(e.target.files[0]); });
