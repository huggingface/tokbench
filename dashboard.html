<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>tokbench — tokenizer benchmark dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
  :root{
    --bg:#0b0d10; --panel:#12151a; --panel-2:#171b22; --line:#232935;
    --fg:#e6e9ef; --muted:#8b95a7; --dim:#5b6577;
    --accent:#5b8cff; --ok:#3ddc97; --warn:#ffb020; --bad:#ff5c5c;
    --radius:12px; --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  a{color:var(--accent)}
  .wrap{max-width:1560px;margin:0 auto;padding:22px 20px 72px}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  h1{font-size:20px;margin:0;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:13px}
  .spacer{flex:1}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 2px;font-weight:600}
  .panel .hint{color:var(--dim);font-size:12px;margin:0 0 12px}
  .grid{display:grid;gap:16px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:16px}
  .kpi .label{color:var(--muted);font-size:12px}
  .kpi .value{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px}
  .kpi .note{color:var(--dim);font-size:11px;margin-top:2px}
  .two{grid-template-columns:1fr}
  @media(min-width:1120px){.two{grid-template-columns:1fr 1fr}}
  .chart{width:100%;height:400px}
  .h-lg{height:440px}.h-xl{height:520px}

  #drop{margin:16px 0;padding:16px 20px;border:1.5px dashed var(--line);border-radius:var(--radius);
    background:var(--panel);display:flex;align-items:center;gap:16px;flex-wrap:wrap;transition:.15s}
  #drop.hot{border-color:var(--accent);background:#141a26}
  .muted{color:var(--muted);font-size:13px}
  button,select{background:var(--panel-2);color:var(--fg);border:1px solid var(--line);border-radius:8px;
    padding:7px 11px;font-size:13px;cursor:pointer;font-family:inherit}
  button:hover,select:hover{border-color:var(--accent)}
  button.on{border-color:var(--accent);color:#fff;background:#1b2537}
  .ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .ctrls .lbl{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border:0;border-radius:0;border-right:1px solid var(--line)}
  .seg button:last-child{border-right:0}

  .tablewrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:13px;min-width:880px}
  th,td{text-align:right;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--panel)}
  th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  td.num{font-variant-numeric:tabular-nums;font-family:var(--mono)}
  tbody tr:hover td{background:var(--panel-2)}
  .badge{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid transparent}
  .b-ok{color:var(--ok);background:rgba(61,220,151,.10);border-color:rgba(61,220,151,.25)}
  .b-bad{color:var(--bad);background:rgba(255,92,92,.10);border-color:rgba(255,92,92,.25)}
  .b-warn{color:var(--warn);background:rgba(255,176,32,.10);border-color:rgba(255,176,32,.25)}
  .b-dim{color:var(--muted);background:rgba(139,149,167,.10);border-color:rgba(139,149,167,.22)}
  .notice{border-left:3px solid var(--warn);background:rgba(255,176,32,.06);padding:10px 14px;
    border-radius:0 8px 8px 0;color:#e8d6b0;font-size:13px;margin-bottom:14px}
  .notice.bad{border-color:var(--bad);background:rgba(255,92,92,.06);color:#f0c8c8}
  .notice b{color:#fff}
  .empty{color:var(--muted);text-align:center;padding:44px 20px}
  code{font-family:var(--mono);font-size:12px;color:#b9c4d8}
  .legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--dim);font-size:11px;margin-top:8px}
  .legend span{display:flex;align-items:center;gap:5px}
  .sw{width:11px;height:11px;border-radius:3px;display:inline-block}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>tokbench</h1>
    <span class="sub">every engine · every model · every language · one verified timing loop</span>
    <div class="spacer"></div>
    <button id="demo">Load sample data</button>
  </header>

  <div id="drop">
    <div>
      <div style="font-weight:600">Drop <code>tokenizer_bench_results.json</code> here</div>
      <div class="muted">…or <label style="color:var(--accent);cursor:pointer;text-decoration:underline">browse<input id="file" type="file" accept=".json,application/json" hidden></label>. Parsed in-page; nothing is uploaded.</div>
    </div>
    <div class="spacer"></div>
    <div class="muted" id="loaded">no data loaded</div>
  </div>

  <div id="app"><div class="empty">Drop a results file, or click <b>Load sample data</b>.</div></div>
</div>

<script>
/* ---------------------------------------------------------------------------
   tokbench dashboard.

   The matrix is engine x model x corpus, which is three dimensions and does not
   fit in a bar chart. Heatmaps are used for the two views that matter:

     1. engine x model      -- median across languages: who is fast, and where
     2. engine x corpus     -- one model, every language: where an engine breaks

   Colour is log-scaled. Throughput here spans ~1.7 to ~1500 MB/s; on a linear
   ramp every engine except the fastest collapses into the same dark cell and
   the chart shows nothing. Log keeps a 2x difference visible at both ends.

   Cells whose ids disagree with the reference are drawn with a red border and
   an x, never silently coloured as if they were comparable. "Hide unverified"
   removes them entirely.
--------------------------------------------------------------------------- */

const $ = (s) => document.querySelector(s);
const PHASES = [
  ["normalization","Normalization"],["pre_tokenization","Pre-tokenization"],
  ["core_encoding","Core encoding"],["post_processing","Post-processing"],
];
const PHASE_COLORS = ["#5b8cff","#3ddc97","#ffb020","#c77dff"];
const REF = "hf-tokenizers";

/* Sequential ramp, dark -> bright. Reads correctly on a dark background and
   stays monotonic in perceived lightness, so "brighter = faster" is honest. */
const RAMP = ["#101826","#152b45","#0f4a5e","#0d6b63","#2b8a5b","#79a840","#c2b52e","#f2a63b","#ff7a4d","#ff4d6d"];
/* Diverging, centred on parity, for the speedup view. */
const DIVERGE = ["#7a2230","#b0454a","#d98b6a","#3a4250","#4e8fbf","#3ddc97","#8ef0a8"];

const fmt = {
  count(n){ if(!isFinite(n)||n<=0) return "—";
    if(n>=1e9) return (n/1e9).toFixed(2)+"B"; if(n>=1e6) return (n/1e6).toFixed(2)+"M";
    if(n>=1e3) return (n/1e3).toFixed(1)+"k"; return n.toFixed(0); },
  mbps(n){ return !isFinite(n)||n<=0 ? "—" : (n>=100?n.toFixed(0):n.toFixed(1)); },
  dur(ns){ if(!isFinite(ns)||ns<=0) return "—";
    if(ns>=1e9) return (ns/1e9).toFixed(2)+"s"; if(ns>=1e6) return (ns/1e6).toFixed(1)+"ms";
    if(ns>=1e3) return (ns/1e3).toFixed(0)+"µs"; return ns.toFixed(0)+"ns"; },
  kb(kb){ if(kb==null||!isFinite(kb)) return "—"; return kb>=1024?(kb/1024).toFixed(1)+" MB":kb.toFixed(0)+" kB"; },
  mb(mb){ return mb==null||!isFinite(mb) ? "—" : mb.toFixed(1)+" MB"; },
};
const esc = (s)=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const median = (xs)=>{ const v=[...xs].sort((a,b)=>a-b); const n=v.length;
  return n?(n%2?v[n>>1]:(v[n/2-1]+v[n/2])/2):NaN; };

/* ---- index the matrix ---------------------------------------------------- */
function runsOf(d){
  if(Array.isArray(d?.runs)&&d.runs.length) return d.runs;
  if(d?.results) return [{dataset_metadata:d.dataset_metadata||{},results:d.results}];
  return [];
}
function index(d){
  const runs=runsOf(d), models=[], corpora=[], engines=[], cell=new Map();
  for(const r of runs){
    const m=r.dataset_metadata?.model??"model", c=r.dataset_metadata?.corpus??"corpus";
    if(!models.includes(m)) models.push(m);
    if(!corpora.includes(c)) corpora.push(c);
    for(const e of (r.results||[])){
      if(!engines.includes(e.tokenizer_name)) engines.push(e.tokenizer_name);
      cell.set(`${m}|${c}|${e.tokenizer_name}`,{...e,model:m,corpus:c,meta:r.dataset_metadata||{}});
    }
  }
  const get=(m,c,e)=>cell.get(`${m}|${c}|${e}`);
  // Order engines by median throughput over the cells they actually ran.
  engines.sort((a,b)=>{
    const s=(n)=>median([...cell.values()].filter(r=>r.tokenizer_name===n&&!r.unsupported).map(r=>r.mbps))||0;
    return s(b)-s(a);
  });
  return {models,corpora,engines,cell,get,runs};
}

/* ---- metrics ------------------------------------------------------------- */
const METRICS = {
  mbps:{ label:"MB/s", better:"higher", log:true, ramp:RAMP,
    val:(X,m,c,e)=>{const r=X.get(m,c,e); return r&&!r.unsupported?r.mbps:null;},
    fmt:(v)=>fmt.mbps(v) },
  speedup:{ label:"× vs reference", better:"higher", log:true, ramp:DIVERGE, center:1,
    val:(X,m,c,e)=>{const r=X.get(m,c,e),b=X.get(m,c,REF);
      return r&&b&&!r.unsupported&&!b.unsupported&&b.mbps>0?r.mbps/b.mbps:null;},
    fmt:(v)=>v>=100?v.toFixed(0)+"×":v.toFixed(1)+"×" },
  nsb:{ label:"ns/byte", better:"lower", log:true, ramp:[...RAMP].reverse(),
    val:(X,m,c,e)=>{const r=X.get(m,c,e); return r&&!r.unsupported?r.ns_per_byte:null;},
    fmt:(v)=>v>=100?v.toFixed(0):v.toFixed(2) },
  tokps:{ label:"tokens/s", better:"higher", log:true, ramp:RAMP,
    val:(X,m,c,e)=>{const r=X.get(m,c,e);
      return r&&!r.unsupported&&r.mean_execution_time_seconds>0?r.total_tokens_produced/r.mean_execution_time_seconds:null;},
    fmt:(v)=>fmt.count(v) },
};

/* ---- chart plumbing ------------------------------------------------------ */
const AXIS={axisLine:{lineStyle:{color:"#232935"}},axisLabel:{color:"#8b95a7"},
  splitLine:{lineStyle:{color:"#1a1f28"}},splitArea:{show:false}};
const TOOLTIP={backgroundColor:"#171b22",borderColor:"#232935",borderWidth:1,
  textStyle:{color:"#e6e9ef",fontSize:12},padding:[8,10],confine:true};
let charts=[];
function mk(el,opt){ if(!el) return; const c=echarts.init(el,null,{renderer:"canvas"}); c.setOption(opt); charts.push(c); return c; }
window.addEventListener("resize",()=>charts.forEach(c=>c.resize()));

/**
 * Heatmap. `rows`/`cols` are label arrays; `valueAt(row,col)` returns
 * {v, verified, meta} or null for "did not run".
 */
function heatmap(el, rows, cols, valueAt, metric, tip, onClick){
  if(!el) return;
  const data=[], raw=[];
  let lo=Infinity, hi=-Infinity;
  for(let y=0;y<rows.length;y++) for(let x=0;x<cols.length;x++){
    const cellv=valueAt(rows[y],cols[x]);
    if(!cellv||cellv.v==null||!isFinite(cellv.v)) continue;
    const v=cellv.v, cv=metric.log?Math.log10(Math.max(v,1e-6)):v;
    lo=Math.min(lo,cv); hi=Math.max(hi,cv);
    data.push({value:[x,y,cv,v,cellv.verified===false?1:0], _c:cellv});
    raw.push(v);
  }
  if(!data.length){ el.innerHTML='<div class="empty">No data for this selection.</div>'; return; }
  if(lo===hi){ lo-=0.5; hi+=0.5; }

  // Centre the diverging ramp on parity so "slower than reference" reads red.
  let vmLo=lo, vmHi=hi;
  if(metric.center!=null && metric.log){
    const c=Math.log10(metric.center), r=Math.max(Math.abs(hi-c),Math.abs(c-lo));
    vmLo=c-r; vmHi=c+r;
  }

  const c = mk(el,{
    grid:{left:8,right:14,top:8,bottom:8,containLabel:true},
    tooltip:{...TOOLTIP,formatter:(p)=>tip(p.data._c,rows[p.value[1]],cols[p.value[0]],p.value[3])},
    xAxis:{type:"category",data:cols,...AXIS,
      axisLabel:{...AXIS.axisLabel,rotate:cols.length>7?32:0,fontSize:11},splitLine:{show:false}},
    yAxis:{type:"category",data:rows,...AXIS,axisLabel:{...AXIS.axisLabel,fontSize:11},splitLine:{show:false}},
    visualMap:{min:vmLo,max:vmHi,calculable:false,show:false,inRange:{color:metric.ramp}},
    series:[{
      type:"heatmap",data,
      label:{show:true,fontSize:10,color:"#0b0d10",fontWeight:600,
        formatter:(p)=>(p.value[4]?"✗ ":"")+metric.fmt(p.value[3])},
      itemStyle:{borderColor:"#0b0d10",borderWidth:2,borderRadius:3},
      emphasis:{itemStyle:{borderColor:"#e6e9ef",borderWidth:2}},
      // Mismatched cells get a hard red border so they cannot be misread as a
      // normal result at a glance.
      markPoint:undefined,
    }],
  });
  if(c){
    c.setOption({series:[{data:data.map(d=>d.value[4]
      ? {...d,itemStyle:{borderColor:"#ff5c5c",borderWidth:2,borderRadius:3}} : d)}]});
    if(onClick) c.on("click",(p)=>onClick(rows[p.value[1]],cols[p.value[0]]));
  }
  return c;
}

/* ---- state --------------------------------------------------------------- */
let DATA=null, X=null;
const S={model:null,corpus:null,engine:null,metric:"mbps",hideBad:false};

function render(){
  charts.forEach(c=>c.dispose()); charts=[];
  X=index(DATA);
  if(!X.runs.length){ $("#app").innerHTML='<div class="empty">No <code>results</code> in that file.</div>'; return; }
  if(!X.models.includes(S.model)) S.model=X.models[0];
  if(!X.corpora.includes(S.corpus)) S.corpus=X.corpora[0];
  if(!X.engines.includes(S.engine)) S.engine=X.engines.find(e=>e!==REF)||X.engines[0];
  const metric=METRICS[S.metric];

  const all=[...X.cell.values()];
  const ran=all.filter(r=>!r.unsupported);
  const bad=ran.filter(r=>r.verified===false);
  const keep=(r)=>!S.hideBad||r.verified!==false;

  // headline: best verified speedup anywhere
  let best=null;
  for(const r of ran){
    if(r.tokenizer_name===REF||r.verified===false) continue;
    const b=X.get(r.model,r.corpus,REF);
    if(!b||b.unsupported||!b.mbps) continue;
    const s=r.mbps/b.mbps;
    if(!best||s>best.s) best={s,r};
  }

  $("#app").innerHTML = `
    ${bad.length?`<div class="notice bad"><b>${bad.length} of ${ran.length} measured cells produced different token ids</b> than <code>${REF}</code>.
      They are drawn with a red border and an ✗, and excluded from every ranking — a different id stream is a different computation, not a faster one.</div>`:""}

    <div class="grid kpis">
      <div class="panel kpi"><div class="label">Matrix</div><div class="value">${X.models.length}×${X.corpora.length}</div>
        <div class="note">${X.models.length} models · ${X.corpora.length} languages · ${X.engines.length} engines</div></div>
      <div class="panel kpi"><div class="label">Cells measured</div><div class="value">${ran.length}</div>
        <div class="note">${all.length-ran.length} unsupported · ${bad.length} id mismatch</div></div>
      <div class="panel kpi"><div class="label">Best verified speedup</div>
        <div class="value">${best?metric.fmt===null?"":best.s.toFixed(0)+"×":"—"}</div>
        <div class="note">${best?esc(best.r.tokenizer_name)+" · "+esc(best.r.model)+"/"+esc(best.r.corpus):""}</div></div>
      <div class="panel kpi"><div class="label">Reference</div><div class="value" style="font-size:16px">${REF}</div>
        <div class="note">the correctness oracle</div></div>
    </div>

    <div class="ctrls">
      <span class="lbl">metric</span>
      <div class="seg" id="metricseg">
        ${Object.entries(METRICS).map(([k,m])=>`<button data-m="${k}" class="${k===S.metric?"on":""}">${m.label}</button>`).join("")}
      </div>
      <span class="lbl">model</span>
      <select id="selmodel">${X.models.map(m=>`<option ${m===S.model?"selected":""}>${esc(m)}</option>`).join("")}</select>
      <span class="lbl">engine</span>
      <select id="selengine">${X.engines.map(e=>`<option ${e===S.engine?"selected":""}>${esc(e)}</option>`).join("")}</select>
      <span class="lbl">corpus</span>
      <select id="selcorpus">${X.corpora.map(c=>`<option ${c===S.corpus?"selected":""}>${esc(c)}</option>`).join("")}</select>
      <button id="hidebad" class="${S.hideBad?"on":""}">${S.hideBad?"✓ ":""}Hide unverified</button>
    </div>

    <div class="panel" style="margin-bottom:16px">
      <h2>Overview — engine × model</h2>
      <p class="hint">Median ${metric.label} across all ${X.corpora.length} languages. Click a cell to focus that model.</p>
      <div id="hm-overview" class="chart h-lg"></div>
      <div class="legend">
        <span><i class="sw" style="background:${metric.ramp[0]}"></i>low</span>
        <span><i class="sw" style="background:${metric.ramp[metric.ramp.length-1]}"></i>high</span>
        <span><i class="sw" style="border:2px solid #ff5c5c;background:transparent"></i>ids differ from reference</span>
        <span>blank = engine cannot run that model</span>
        <span>log-scaled colour</span>
      </div>
    </div>

    <div class="panel" style="margin-bottom:16px">
      <h2>All languages — engine × corpus for <span style="color:var(--fg)">${esc(S.model)}</span></h2>
      <p class="hint">${metric.label}, ${metric.better} is better. This is where an engine's script coverage shows: CJK, Thai and Arabic behave nothing like Latin prose.</p>
      <div id="hm-lang" class="chart h-lg"></div>
    </div>

    <div class="panel" style="margin-bottom:16px">
      <h2>One engine everywhere — <span style="color:var(--fg)">${esc(S.engine)}</span>, model × corpus</h2>
      <p class="hint">${metric.label} for every model and language this engine ran.</p>
      <div id="hm-engine" class="chart h-lg"></div>
    </div>

    <div class="grid two" style="margin-bottom:16px">
      <div class="panel">
        <h2>Multi-thread throughput — <span style="color:var(--fg)">${esc(S.model)}</span></h2>
        <p class="hint">MB/s against thread count, log axis. Dashed grey is perfect linear scaling from each engine's own 1-thread number.</p>
        <div id="c-mt" class="chart"></div>
      </div>
      <div class="panel">
        <h2>Scaling efficiency vs linear</h2>
        <p class="hint">100% = every added core added a full core of throughput. This is where shared-cache locking shows up: a great 1-thread number can still scale at 20%.</p>
        <div id="c-mteff" class="chart"></div>
      </div>
    </div>

    <div class="grid two" style="margin-bottom:16px">
      <div class="panel">
        <h2>Throughput &amp; efficiency — ${esc(S.model)} / ${esc(S.corpus)}</h2>
        <p class="hint">Tokens per second against nanoseconds per byte, separate axes.</p>
        <div id="c-speed" class="chart"></div>
      </div>
      <div class="panel">
        <h2>Where the time goes — ${esc(S.model)} / ${esc(S.corpus)}</h2>
        <p class="hint">Share of encode time per stage. Pre-tokenization is broken out because it is usually the bottleneck.</p>
        <div id="c-phase" class="chart"></div>
      </div>
    </div>

    <div class="panel" style="margin-bottom:16px">
      <h2>Footprint</h2>
      <p class="hint">Published package size (what you download) against resident memory once loaded and warmed.</p>
      <div id="c-foot" class="chart"></div>
    </div>

    <div class="panel">
      <h2>Cells — ${esc(S.model)} / ${esc(S.corpus)}</h2>
      <p class="hint">Every engine on the selected cell, including the ones that could not run.</p>
      <div class="tablewrap"><table>
        <thead><tr><th>Engine</th><th>MB/s</th><th>ns/B</th><th>tok/s</th><th>Tokens</th>
          <th>Time</th><th>Load</th><th>RSS</th><th>Package</th><th>Class</th><th>IDs</th></tr></thead>
        <tbody>${X.engines.map(e=>rowHtml(X.get(S.model,S.corpus,e),e)).join("")}</tbody>
      </table></div>
    </div>`;

  // --- overview: engine x model, median over corpora ---
  heatmap($("#hm-overview"), X.engines, X.models, (eng,mod)=>{
    const vals=[], bads=[];
    for(const c of X.corpora){
      const r=X.get(mod,c,eng); if(!r||r.unsupported||!keep(r)) continue;
      const v=metric.val(X,mod,c,eng); if(v==null||!isFinite(v)) continue;
      vals.push(v); bads.push(r.verified===false);
    }
    if(!vals.length) return null;
    return {v:median(vals),verified:bads.some(Boolean)?false:true,n:vals.length,eng,mod};
  }, metric, (c,eng,mod,v)=>`<b>${esc(eng)}</b> · ${esc(mod)}<br>
      median ${metric.fmt(v)} ${metric.label}<br>
      <span style="color:#8b95a7">${c.n} language${c.n>1?"s":""}</span>
      ${c.verified===false?'<div style="color:#ff5c5c">⚠ some languages produce different ids</div>':""}`,
    (eng,mod)=>{ S.model=mod; S.engine=eng; render(); });

  // --- all languages for the selected model ---
  heatmap($("#hm-lang"), X.engines, X.corpora, (eng,cor)=>{
    const r=X.get(S.model,cor,eng); if(!r||r.unsupported||!keep(r)) return null;
    const v=metric.val(X,S.model,cor,eng); if(v==null||!isFinite(v)) return null;
    return {v,verified:r.verified,r};
  }, metric, (c,eng,cor,v)=>{
    const r=c.r, b=X.get(S.model,cor,REF);
    const sp=b&&!b.unsupported&&b.mbps?` · ${(r.mbps/b.mbps).toFixed(1)}× vs ref`:"";
    return `<b>${esc(eng)}</b> · ${esc(S.model)}/${esc(cor)}<br>
      ${fmt.mbps(r.mbps)} MB/s${sp}<br>${r.ns_per_byte.toFixed(2)} ns/B · ${fmt.count(r.total_tokens_produced)} tokens<br>
      <span style="color:#8b95a7">${fmt.dur(r.mean_execution_time_seconds*1e9)}</span>
      ${r.verified===false?'<div style="color:#ff5c5c">⚠ ids differ from reference</div>':""}
      ${r.also_computes?`<div style="color:#8b95a7">also: ${esc(r.also_computes)}</div>`:""}`;
  }, (eng,cor)=>{ S.corpus=cor; S.engine=eng; render(); });

  // --- one engine across model x corpus ---
  heatmap($("#hm-engine"), X.models, X.corpora, (mod,cor)=>{
    const r=X.get(mod,cor,S.engine); if(!r||r.unsupported||!keep(r)) return null;
    const v=metric.val(X,mod,cor,S.engine); if(v==null||!isFinite(v)) return null;
    return {v,verified:r.verified,r};
  }, metric, (c,mod,cor,v)=>`<b>${esc(S.engine)}</b><br>${esc(mod)} / ${esc(cor)}<br>
      ${metric.fmt(v)} ${metric.label}<br>
      <span style="color:#8b95a7">${fmt.count(c.r.total_tokens_produced)} tokens</span>
      ${c.r.verified===false?'<div style="color:#ff5c5c">⚠ ids differ from reference</div>':""}`,
    (mod,cor)=>{ S.model=mod; S.corpus=cor; render(); });

  drawScaling();
  drawCell();
  wire();
}

/* Distinct, stable colour per engine so a series keeps its identity across
   every chart on the page. */
const SERIES=["#5b8cff","#3ddc97","#ffb020","#c77dff","#ff7ab6","#4ecdc4","#ff6b6b","#a8e063"];
const engColor=(name)=>SERIES[Math.abs([...name].reduce((h,c)=>h*31+c.charCodeAt(0)|0,7))%SERIES.length];

/**
 * Multi-thread scaling. The sweep is only run on the corpora named with
 * `--scaling`, so this looks for whichever corpus of the selected model has
 * the data and says which one it used.
 */
function drawScaling(){
  const cor = X.corpora.find(c=>X.engines.some(e=>X.get(S.model,c,e)?.scaling?.length));
  const mtEl=$("#c-mt"), effEl=$("#c-mteff");
  if(!cor){
    const msg='<div class="empty">No scaling sweep in this run.<br><span style="font-size:12px">'
      +'Re-run with <code>--scaling &lt;corpus&gt;</code> (e.g. <code>--scaling english</code>).</span></div>';
    if(mtEl) mtEl.innerHTML=msg; if(effEl) effEl.innerHTML=msg; return;
  }
  const rows=X.engines.map(e=>X.get(S.model,cor,e)).filter(r=>r&&!r.unsupported&&r.scaling?.length);
  if(!rows.length){ mtEl.innerHTML='<div class="empty">No scaling data for this model.</div>';
    effEl.innerHTML=mtEl.innerHTML; return; }

  const threads=[...new Set(rows.flatMap(r=>r.scaling.map(p=>p.threads)))].sort((a,b)=>a-b);
  const at=(r,n)=>r.scaling.find(p=>p.threads===n);

  // Ideal line: each engine's 1-thread rate times the thread count. Drawn once,
  // from the fastest engine, so the chart shows the ceiling without eight
  // near-identical dashed lines.
  const fastest=rows.reduce((a,b)=>(at(b,1)?.mbps??0)>(at(a,1)?.mbps??0)?b:a);
  const base1=at(fastest,1)?.mbps??0;

  mk(mtEl,{
    grid:{left:8,right:14,top:44,bottom:8,containLabel:true},
    legend:{data:[...rows.map(r=>r.tokenizer_name),"linear (ideal)"],textStyle:{color:"#8b95a7"},
      top:0,itemWidth:14,itemHeight:10,type:"scroll"},
    tooltip:{...TOOLTIP,trigger:"axis",formatter(ps){
      const n=threads[ps[0].dataIndex];
      const lines=ps.filter(p=>p.value!=null).map(p=>{
        const r=rows.find(x=>x.tokenizer_name===p.seriesName);
        const q=r?at(r,n):null;
        return `<div>${p.marker}${esc(p.seriesName)}: <b>${fmt.mbps(p.value)} MB/s</b>`
          +(q?` <span style="color:#8b95a7">(${q.efficiency_pct.toFixed(0)}% of linear)</span>`:"")+`</div>`;
      }).join("");
      return `<b>${n} thread${n>1?"s":""}</b><br>${lines}`;
    }},
    xAxis:{type:"category",data:threads,name:"threads",nameLocation:"middle",nameGap:26,
      nameTextStyle:{color:"#8b95a7"},...AXIS},
    yAxis:{type:"log",name:"MB/s",nameTextStyle:{color:"#8b95a7"},...AXIS,
      axisLabel:{...AXIS.axisLabel,formatter:(v)=>fmt.count(v)}},
    series:[
      ...rows.map(r=>({name:r.tokenizer_name,type:"line",smooth:false,symbolSize:6,
        lineStyle:{width:2,color:engColor(r.tokenizer_name)},itemStyle:{color:engColor(r.tokenizer_name)},
        data:threads.map(n=>at(r,n)?.mbps??null)})),
      {name:"linear (ideal)",type:"line",symbol:"none",
        lineStyle:{width:1.5,type:"dashed",color:"#5b6577"},
        data:threads.map(n=>base1*n)},
    ],
  });

  mk(effEl,{
    grid:{left:8,right:14,top:44,bottom:8,containLabel:true},
    legend:{data:rows.map(r=>r.tokenizer_name),textStyle:{color:"#8b95a7"},top:0,
      itemWidth:14,itemHeight:10,type:"scroll"},
    tooltip:{...TOOLTIP,trigger:"axis",formatter(ps){
      const n=threads[ps[0].dataIndex];
      return `<b>${n} thread${n>1?"s":""}</b><br>`+ps.filter(p=>p.value!=null).map(p=>{
        const r=rows.find(x=>x.tokenizer_name===p.seriesName), q=r?at(r,n):null;
        return `<div>${p.marker}${esc(p.seriesName)}: <b>${p.value.toFixed(0)}%</b>`
          +(q?` <span style="color:#8b95a7">${fmt.mbps(q.mbps)} MB/s</span>`:"")+`</div>`;
      }).join("");
    }},
    xAxis:{type:"category",data:threads,name:"threads",nameLocation:"middle",nameGap:26,
      nameTextStyle:{color:"#8b95a7"},...AXIS},
    yAxis:{type:"value",name:"% of linear",nameTextStyle:{color:"#8b95a7"},...AXIS,
      axisLabel:{...AXIS.axisLabel,formatter:"{value}%"}},
    series:rows.map((r,i)=>({name:r.tokenizer_name,type:"line",symbolSize:6,
      lineStyle:{width:2,color:engColor(r.tokenizer_name)},itemStyle:{color:engColor(r.tokenizer_name)},
      data:threads.map(n=>at(r,n)?.efficiency_pct??null),
      // One 100% guide line for the whole chart, on the first series only.
      markLine:i===0?{silent:true,symbol:"none",
        lineStyle:{color:"#3ddc97",type:"dashed",width:1.5},
        label:{formatter:"perfect linear",color:"#3ddc97",fontSize:10,position:"insideEndTop"},
        data:[{yAxis:100}]}:undefined})),
  });

  const note=document.createElement("div");
  note.className="legend";
  note.innerHTML=`<span>sweep corpus: <b style="color:var(--fg)">${esc(cor)}</b></span>
    <span>each thread gets its own engine instance; documents pulled from a shared queue</span>`;
  effEl.parentElement.appendChild(note);
}

function cellRows(){
  return X.engines.map(e=>X.get(S.model,S.corpus,e)).filter(r=>r&&!r.unsupported);
}

function drawCell(){
  const rows=cellRows();
  // speed + efficiency
  const r=[...rows].sort((a,b)=>b.mbps-a.mbps);
  if(r.length) mk($("#c-speed"),{
    grid:{left:8,right:8,top:40,bottom:8,containLabel:true},
    legend:{data:["Tokens / second","ns per byte"],textStyle:{color:"#8b95a7"},top:0,itemWidth:12,itemHeight:12},
    tooltip:{...TOOLTIP,trigger:"axis",axisPointer:{type:"shadow"},formatter(ps){
      const x=r[ps[0].dataIndex];
      return `<b>${esc(x.tokenizer_name)}</b> <span style="color:#5b6577">${esc(x.engine_version||"")}</span><br>
        ${fmt.count(x.total_tokens_produced/x.mean_execution_time_seconds)} tok/S<br>
        ${x.ns_per_byte.toFixed(2)} ns/B · ${fmt.mbps(x.mbps)} MB/s<br>
        <span style="color:#8b95a7">${fmt.count(x.total_tokens_produced)} tokens in ${fmt.dur(x.mean_execution_time_seconds*1e9)}</span>
        ${x.also_computes?`<div style="color:#8b95a7">also computes: ${esc(x.also_computes)}</div>`:""}
        ${x.internally_parallel?'<div style="color:#ffb020">⚠ multi-threaded internally</div>':""}
        ${x.verified===false?'<div style="color:#ff5c5c">⚠ ids differ — not comparable</div>':""}`;
    }},
    xAxis:{type:"category",data:r.map(x=>x.tokenizer_name),...AXIS,
      axisLabel:{...AXIS.axisLabel,rotate:r.length>5?28:0,fontSize:11}},
    yAxis:[{type:"value",name:"tok/S",nameTextStyle:{color:"#8b95a7"},...AXIS,
        axisLabel:{...AXIS.axisLabel,formatter:(v)=>fmt.count(v)}},
      {type:"value",name:"ns/B",nameTextStyle:{color:"#8b95a7"},...AXIS,splitLine:{show:false}}],
    series:[
      {name:"Tokens / second",type:"bar",yAxisIndex:0,barMaxWidth:34,
        data:r.map(x=>({value:x.total_tokens_produced/x.mean_execution_time_seconds,
          itemStyle:{color:x.verified===false?"#7a2230":"#5b8cff",borderRadius:[3,3,0,0]}}))},
      {name:"ns per byte",type:"bar",yAxisIndex:1,barMaxWidth:34,
        data:r.map(x=>({value:x.ns_per_byte,
          itemStyle:{color:x.verified===false?"#5a4020":"#3ddc97",borderRadius:[3,3,0,0]}}))},
    ],
  }); else $("#c-speed").innerHTML='<div class="empty">No engine ran this cell.</div>';

  // phases
  const p=rows.filter(x=>x.breakdown_nanoseconds);
  if(!p.length) $("#c-phase").innerHTML='<div class="empty">No engine here reports a phase breakdown.<br>'
    +'<span style="font-size:12px">Only engines whose API exposes stages separately are instrumented; the rest are left blank rather than given an invented split.</span></div>';
  else {
    const tot=p.map(x=>PHASES.reduce((s,[k])=>s+(x.breakdown_nanoseconds[k]||0),0));
    mk($("#c-phase"),{
      grid:{left:8,right:22,top:40,bottom:8,containLabel:true},
      legend:{data:PHASES.map(x=>x[1]),textStyle:{color:"#8b95a7"},top:0,itemWidth:12,itemHeight:12},
      tooltip:{...TOOLTIP,trigger:"axis",axisPointer:{type:"shadow"},formatter(ps){
        const i=ps[0].dataIndex,x=p[i],t=tot[i];
        return `<b>${esc(x.tokenizer_name)}</b><br>`+PHASES.map(([k,l],j)=>{
          const ns=x.breakdown_nanoseconds[k]||0;
          return `<div><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${PHASE_COLORS[j]};margin-right:6px"></span>
            ${l}: <b>${(ns/t*100).toFixed(1)}%</b> <span style="color:#8b95a7">(${fmt.dur(ns)})</span></div>`;
        }).join("")+`<div style="color:#8b95a7;margin-top:4px">total ${fmt.dur(t)}</div>`;
      }},
      xAxis:{type:"value",max:100,...AXIS,axisLabel:{...AXIS.axisLabel,formatter:"{value}%"}},
      yAxis:{type:"category",data:p.map(x=>x.tokenizer_name),...AXIS,splitLine:{show:false}},
      series:PHASES.map(([k,l],j)=>({name:l,type:"bar",stack:"t",barMaxWidth:26,
        itemStyle:{color:PHASE_COLORS[j]},
        data:p.map((x,i)=>tot[i]?(x.breakdown_nanoseconds[k]||0)/tot[i]*100:0)})),
    });
  }

  // footprint — one row per engine, deduped across the matrix
  const seen=new Map();
  for(const r2 of X.cell.values()){
    if(r2.unsupported) continue;
    const k=r2.tokenizer_name;
    if(!seen.has(k)||(seen.get(k).rss_delta_mb==null&&r2.rss_delta_mb!=null)) seen.set(k,r2);
  }
  const f=[...seen.values()].filter(x=>x.crate_size_kb!=null||x.rss_delta_mb!=null)
    .sort((a,b)=>(b.crate_size_kb||0)-(a.crate_size_kb||0));
  if(!f.length) $("#c-foot").innerHTML='<div class="empty">No footprint data.<br><span style="font-size:12px">Run <code>scripts/package_size.py</code>, and the driver without <code>--no-memory</code>.</span></div>';
  else mk($("#c-foot"),{
    grid:{left:8,right:22,top:40,bottom:8,containLabel:true},
    legend:{data:["Package size","Resident memory"],textStyle:{color:"#8b95a7"},top:0,itemWidth:12,itemHeight:12},
    tooltip:{...TOOLTIP,trigger:"axis",axisPointer:{type:"shadow"},formatter(ps){
      const x=f[ps[0].dataIndex];
      return `<b>${esc(x.tokenizer_name)}</b><br>package: <b>${fmt.kb(x.crate_size_kb)}</b>
        <span style="color:#5b6577">${esc(x.package_ref||"")}</span><br>
        resident: <b>${fmt.mb(x.rss_delta_mb)}</b>
        ${x.rss_peak_mb!=null?`<div style="color:#8b95a7">peak RSS ${fmt.mb(x.rss_peak_mb)}</div>`:""}
        ${x.binary_delta_kb!=null?`<div style="color:#8b95a7">adds ${fmt.kb(x.binary_delta_kb)} to a binary (gzipped)</div>`:""}`;
    }},
    xAxis:[{type:"value",name:"package kB",nameTextStyle:{color:"#8b95a7"},...AXIS,
        axisLabel:{...AXIS.axisLabel,formatter:(v)=>fmt.count(v)}},
      {type:"value",name:"RSS MB",nameTextStyle:{color:"#8b95a7"},...AXIS,splitLine:{show:false}}],
    yAxis:{type:"category",data:f.map(x=>x.tokenizer_name),...AXIS,splitLine:{show:false}},
    series:[
      {name:"Package size",type:"bar",xAxisIndex:0,barMaxWidth:15,itemStyle:{color:"#c77dff",borderRadius:[0,3,3,0]},
        data:f.map(x=>x.crate_size_kb??0)},
      {name:"Resident memory",type:"bar",xAxisIndex:1,barMaxWidth:15,itemStyle:{color:"#ff7ab6",borderRadius:[0,3,3,0]},
        data:f.map(x=>x.rss_delta_mb??0)},
    ],
  });
}

function rowHtml(r,name){
  if(!r) return `<tr><td style="color:var(--dim)">${esc(name)}</td><td colspan="10" style="color:var(--dim)">not run</td></tr>`;
  if(r.unsupported) return `<tr><td><span style="color:var(--muted)">${esc(name)}</span>
      <span class="badge b-dim">unsupported</span>
      <div style="color:var(--dim);font-size:11px;white-space:normal;max-width:420px">${esc(r.unsupported)}</div></td>
    <td colspan="10" style="color:var(--dim)">—</td></tr>`;
  const idb=r.verified===true?'<span class="badge b-ok">match</span>'
    :r.verified===false?'<span class="badge b-bad">differ</span>':'<span class="badge b-dim">unverified</span>';
  const cls=r.engine_class==="native"?"b-ok":r.engine_class==="subprocess"?"b-warn":"b-dim";
  const notes=[r.also_computes?`also ${esc(r.also_computes)}`:"",r.internally_parallel?"multi-threaded":"",
    r.package_ref?esc(r.package_ref):""].filter(Boolean).join(" · ");
  return `<tr>
    <td><b>${esc(name)}</b> <span style="color:var(--dim);font-size:11px">${esc(r.engine_lang||"")}</span>
      ${notes?`<div style="color:var(--dim);font-size:11px;white-space:normal;max-width:420px">${notes}</div>`:""}</td>
    <td class="num">${fmt.mbps(r.mbps)}</td>
    <td class="num">${r.ns_per_byte?r.ns_per_byte.toFixed(2):"—"}</td>
    <td class="num">${fmt.count(r.total_tokens_produced/r.mean_execution_time_seconds)}</td>
    <td class="num">${fmt.count(r.total_tokens_produced)}</td>
    <td class="num">${fmt.dur(r.mean_execution_time_seconds*1e9)}</td>
    <td class="num">${r.load_ms!=null?r.load_ms.toFixed(0)+" ms":"—"}</td>
    <td class="num">${fmt.mb(r.rss_delta_mb)}</td>
    <td class="num">${fmt.kb(r.crate_size_kb)}</td>
    <td><span class="badge ${cls}">${esc(r.engine_class||"?")}</span></td>
    <td>${idb}</td></tr>`;
}

function wire(){
  $("#metricseg").addEventListener("click",(e)=>{
    const b=e.target.closest("button"); if(!b) return; S.metric=b.dataset.m; render();
  });
  $("#selmodel").onchange=(e)=>{S.model=e.target.value;render();};
  $("#selcorpus").onchange=(e)=>{S.corpus=e.target.value;render();};
  $("#selengine").onchange=(e)=>{S.engine=e.target.value;render();};
  $("#hidebad").onclick=()=>{S.hideBad=!S.hideBad;render();};
}

/* ---- input --------------------------------------------------------------- */
function load(o,label){ DATA=o; $("#loaded").textContent=label; render(); }
function readFile(f){
  const rd=new FileReader();
  rd.onload=()=>{ try{ load(JSON.parse(rd.result),`${f.name} · ${(f.size/1024).toFixed(0)} kB`); }
    catch(e){ $("#app").innerHTML=`<div class="notice bad">Could not parse <b>${esc(f.name)}</b>: ${esc(e.message)}</div>`; } };
  rd.readAsText(f);
}
const drop=$("#drop");
["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("hot");}));
["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("hot");}));
drop.addEventListener("drop",e=>{const f=e.dataTransfer.files?.[0];if(f)readFile(f);});
$("#file").addEventListener("change",e=>{if(e.target.files[0])readFile(e.target.files[0]);});

/* Sample data: a small matrix with the honest edge cases in it — an
   unsupported engine, an id mismatch on Unigram, an uninstrumented breakdown —
   so the layout can be judged before a real run exists. */
const MOCK=(()=>{
  const models=["gpt2","llama-3","albert"], corpora=["english","chinese","code","thai","arabic"];
  const base={ "hf-tokenizers":11, "pipeline":500, "tokie":70, "tiktoken":31, "mistral-common":13 };
  const runs=[];
  for(const m of models) for(const c of corpora){
    const bytes=200000, results=[];
    for(const [name,b] of Object.entries(base)){
      if(name==="tiktoken"&&m==="albert"){ results.push({tokenizer_name:name,unsupported:"tiktoken has no Unigram"}); continue; }
      if(name==="mistral-common"&&m!=="llama-3"){ results.push({tokenizer_name:name,unsupported:"no tekken.json"}); continue; }
      const scale={english:1,chinese:.45,code:.8,thai:.5,arabic:.6}[c]*(m==="albert"?.25:m==="llama-3"?1.2:1);
      const mbps=b*scale, secs=(bytes/(1024*1024))/mbps;
      const badIds=(name==="pipeline"||name==="tokie")&&m==="albert";
      results.push({tokenizer_name:name,total_tokens_produced:Math.round(bytes/4.2),
        mean_execution_time_seconds:secs,mbps,ns_per_byte:secs*1e9/bytes,
        engine_version:name,engine_lang:name==="mistral-common"?"python":"rust",
        engine_class:name==="mistral-common"?"subprocess":"native",
        also_computes:name==="hf-tokenizers"?"byte offsets, word ids, attention mask":"",
        internally_parallel:false,load_ms:name==="hf-tokenizers"?74:40,
        ids_hash:badIds?"deadbeef":"47cdd139",verified:name===REF?true:!badIds,
        rss_delta_mb:{ "hf-tokenizers":35,"pipeline":33,"tokie":43,"tiktoken":12,"mistral-common":58 }[name],
        crate_size_kb:{ "hf-tokenizers":191.6,"pipeline":null,"tokie":181,"tiktoken":3699.4,"mistral-common":6400 }[name],
        package_ref:name==="tokie"?"tokie 0.1.4 (crates.io)":"",
        ...(name==="hf-tokenizers"?{breakdown_nanoseconds:{normalization:1500,pre_tokenization:90525501,core_encoding:30660291,post_processing:13704329}}:{}),
        // Scaling only on the corpus the sweep was asked for, as in a real run.
        // Efficiency decays differently per engine on purpose: that contrast is
        // the whole point of the chart.
        ...(c==="english"?{scaling:[1,2,4,8].map(n=>{
          const eff={ "hf-tokenizers":[100,72,48,29],"pipeline":[100,96,91,84],"tokie":[100,93,85,74],
                      "tiktoken":[100,88,76,61],"mistral-common":[100,55,31,18] }[name][[1,2,4,8].indexOf(n)];
          return {threads:n,mbps:mbps*n*eff/100,efficiency_pct:eff};
        })}:{})});
    }
    runs.push({dataset_metadata:{file_size_bytes:bytes,total_characters:bytes,corpus:c,model:m,reps:5,warmup:true},results});
  }
  return {dataset_metadata:runs[0].dataset_metadata,results:runs[0].results,runs};
})();
$("#demo").addEventListener("click",()=>load(structuredClone(MOCK),"sample data (not a real measurement)"));

    +'open it with a network connection, or vendor <code>echarts.min.js</code> beside this file and edit the script tag.</div>';
}
