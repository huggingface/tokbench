<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>tokbench — tokenizer benchmark dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<!-- echarts-gl adds bar3D. Optional: if it fails to load, the 3D panel falls
     back to a grouped 2D bar chart rather than leaving a hole. -->
<script src="https://cdn.jsdelivr.net/npm/echarts-gl@2.0.9/dist/echarts-gl.min.js"></script>
<style>
  :root{
    --bg:#0b0d10; --panel:#12151a; --panel-2:#171b22; --line:#232935;
    --fg:#e6e9ef; --muted:#8b95a7; --dim:#5b6577;
    --accent:#5b8cff; --ok:#3ddc97; --warn:#ffb020; --bad:#ff5c5c;
    --radius:12px; --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  a{color:var(--accent)}
  .wrap{max-width:1560px;margin:0 auto;padding:22px 20px 72px}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  h1{font-size:20px;margin:0;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:13px}
  .spacer{flex:1}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 2px;font-weight:600}
  .panel .hint{color:var(--dim);font-size:12px;margin:0 0 12px}
  .grid{display:grid;gap:16px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:16px}
  .kpi .label{color:var(--muted);font-size:12px}
  .kpi .value{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px}
  .kpi .note{color:var(--dim);font-size:11px;margin-top:2px}
  .two{grid-template-columns:1fr}
  @media(min-width:1120px){.two{grid-template-columns:1fr 1fr}}
  .chart{width:100%;height:400px}
  .h-lg{height:440px}.h-xl{height:760px}

  #drop{margin:16px 0;padding:16px 20px;border:1.5px dashed var(--line);border-radius:var(--radius);
    background:var(--panel);display:flex;align-items:center;gap:16px;flex-wrap:wrap;transition:.15s}
  #drop.hot{border-color:var(--accent);background:#141a26}
  .muted{color:var(--muted);font-size:13px}
  button,select{background:var(--panel-2);color:var(--fg);border:1px solid var(--line);border-radius:8px;
    padding:7px 11px;font-size:13px;cursor:pointer;font-family:inherit}
  button:hover,select:hover{border-color:var(--accent)}
  button.on{border-color:var(--accent);color:#fff;background:#1b2537}
  .ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .ctrls .lbl{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border:0;border-radius:0;border-right:1px solid var(--line)}
  .seg button:last-child{border-right:0}

  .tablewrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:13px;min-width:880px}
  th,td{text-align:right;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--panel)}
  th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  td.num{font-variant-numeric:tabular-nums;font-family:var(--mono)}
  tbody tr:hover td{background:var(--panel-2)}
  .badge{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid transparent}
  .b-ok{color:var(--ok);background:rgba(61,220,151,.10);border-color:rgba(61,220,151,.25)}
  .b-bad{color:var(--bad);background:rgba(255,92,92,.10);border-color:rgba(255,92,92,.25)}
  .b-warn{color:var(--warn);background:rgba(255,176,32,.10);border-color:rgba(255,176,32,.25)}
  .b-dim{color:var(--muted);background:rgba(139,149,167,.10);border-color:rgba(139,149,167,.22)}
  .notice{border-left:3px solid var(--warn);background:rgba(255,176,32,.06);padding:10px 14px;
    border-radius:0 8px 8px 0;color:#e8d6b0;font-size:13px;margin-bottom:14px}
  .notice.bad{border-color:var(--bad);background:rgba(255,92,92,.06);color:#f0c8c8}
  .notice b{color:#fff}
  .empty{color:var(--muted);text-align:center;padding:44px 20px}
  code{font-family:var(--mono);font-size:12px;color:#b9c4d8}
  .legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--dim);font-size:11px;margin-top:8px}
  .legend span{display:flex;align-items:center;gap:5px}
  .sw{width:11px;height:11px;border-radius:3px;display:inline-block}

  /* small multiples */
  .sm-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(460px,1fr))}
  .sm{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px 6px 4px}
  .sm-title{font-size:13px;font-weight:600;color:var(--fg);padding:0 6px 2px;cursor:pointer}
  .sm-title:hover{color:var(--accent);text-decoration:underline}
  .sm-chart{width:100%;height:340px}

  /* sortable tables */
  th.sortable{cursor:pointer;user-select:none}
  th.sortable:hover{color:var(--fg)}
  th .arrow{opacity:.35;margin-left:4px;font-size:10px}
  th.sorted .arrow{opacity:1;color:var(--accent)}
  th.sorted{color:var(--fg)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>tokbench</h1>
    <span class="sub">every engine · every model · every language · one verified timing loop</span>
    <div class="spacer"></div>
    <button id="demo">Load sample data</button>
  </header>

  <div id="drop">
    <div>
      <div style="font-weight:600">Drop <code>tokenizer_bench_results.json</code> here</div>
      <div class="muted">…or <label style="color:var(--accent);cursor:pointer;text-decoration:underline">browse<input id="file" type="file" accept=".json,application/json" hidden></label>. Parsed in-page; nothing is uploaded.</div>
    </div>
    <div class="spacer"></div>
    <div class="muted" id="loaded">no data loaded</div>
  </div>

  <div id="app"><div class="empty">Drop a results file, or click <b>Load sample data</b>.</div></div>
</div>

<script>
/* ---------------------------------------------------------------------------
   tokbench dashboard.

   The matrix is engine x model x corpus, which is three dimensions and does not
   fit in a bar chart. Heatmaps are used for the two views that matter:

     1. engine x model      -- median across languages: who is fast, and where
     2. engine x corpus     -- one model, every language: where an engine breaks

   Colour is log-scaled. Throughput here spans ~1.7 to ~1500 MB/s; on a linear
   ramp every engine except the fastest collapses into the same dark cell and
   the chart shows nothing. Log keeps a 2x difference visible at both ends.

   Cells whose ids disagree with the reference are drawn with a red border and
   an x, never silently coloured as if they were comparable. "Hide unverified"
   removes them entirely.
--------------------------------------------------------------------------- */

const $ = (s) => document.querySelector(s);
const PHASES = [
  ["normalization","Normalization"],["pre_tokenization","Pre-tokenization"],
  ["core_encoding","Core encoding"],["post_processing","Post-processing"],
];
const PHASE_COLORS = ["#5b8cff","#3ddc97","#ffb020","#c77dff"];
const REF = "hf-tokenizers";

/* Sequential ramp, dark -> bright. Reads correctly on a dark background and
   stays monotonic in perceived lightness, so "brighter = faster" is honest. */
const RAMP = ["#101826","#152b45","#0f4a5e","#0d6b63","#2b8a5b","#79a840","#c2b52e","#f2a63b","#ff7a4d","#ff4d6d"];
/* Diverging, centred on parity, for the speedup view. */
const DIVERGE = ["#7a2230","#b0454a","#d98b6a","#3a4250","#4e8fbf","#3ddc97","#8ef0a8"];

const fmt = {
  count(n){ if(!isFinite(n)||n<=0) return "—";
    if(n>=1e9) return (n/1e9).toFixed(2)+"B"; if(n>=1e6) return (n/1e6).toFixed(2)+"M";
    if(n>=1e3) return (n/1e3).toFixed(1)+"k"; return n.toFixed(0); },
  mbps(n){ return !isFinite(n)||n<=0 ? "—" : (n>=1?n.toFixed(0):n.toFixed(1)); },
  dur(ns){ if(!isFinite(ns)||ns<=0) return "—";
    if(ns>=1e9) return (ns/1e9).toFixed(2)+"s"; if(ns>=1e6) return (ns/1e6).toFixed(1)+"ms";
    if(ns>=1e3) return (ns/1e3).toFixed(0)+"µs"; return ns.toFixed(0)+"ns"; },
  kb(kb){ if(kb==null||!isFinite(kb)) return "—"; return kb>=1024?(kb/1024).toFixed(1)+" MB":kb.toFixed(0)+" kB"; },
  mb(mb){ return mb==null||!isFinite(mb) ? "—" : mb.toFixed(1)+" MB"; },
};
const esc = (s)=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const median = (xs)=>{ const v=[...xs].sort((a,b)=>a-b); const n=v.length;
  return n?(n%2?v[n>>1]:(v[n/2-1]+v[n/2])/2):NaN; };

/* ---- index the matrix ---------------------------------------------------- */
function runsOf(d){
  if(Array.isArray(d?.runs)&&d.runs.length) return d.runs;
  if(d?.results) return [{dataset_metadata:d.dataset_metadata||{},results:d.results}];
  return [];
}
function index(d){
  const runs=runsOf(d), models=[], corpora=[], engines=[], cell=new Map();
  for(const r of runs){
    const m=r.dataset_metadata?.model??"model", c=r.dataset_metadata?.corpus??"corpus";
    if(!models.includes(m)) models.push(m);
    if(!corpora.includes(c)) corpora.push(c);
    for(const e of (r.results||[])){
      if(!engines.includes(e.tokenizer_name)) engines.push(e.tokenizer_name);
      cell.set(`${m}|${c}|${e.tokenizer_name}`,{...e,model:m,corpus:c,meta:r.dataset_metadata||{}});
    }
  }
  const get=(m,c,e)=>cell.get(`${m}|${c}|${e}`);
  // Order engines by median throughput over the cells they actually ran.
  engines.sort((a,b)=>{
    const s=(n)=>median([...cell.values()].filter(r=>r.tokenizer_name===n&&!r.unsupported).map(r=>r.mbps))||0;
    return s(b)-s(a);
  });
  return {models,corpora,engines,cell,get,runs};
}

/* ---- metrics ------------------------------------------------------------- */
const METRICS = {
  mbps:{ label:"MB/s", better:"higher", log:true, ramp:RAMP,
    val:(X,m,c,e)=>{const r=X.get(m,c,e); return r&&!r.unsupported?r.mbps:null;},
    fmt:(v)=>fmt.mbps(v) },
  speedup:{ label:"× vs reference", better:"higher", log:true, ramp:DIVERGE, center:1,
    val:(X,m,c,e)=>{const r=X.get(m,c,e),b=X.get(m,c,REF);
      return r&&b&&!r.unsupported&&!b.unsupported&&b.mbps>0?r.mbps/b.mbps:null;},
    fmt:(v)=>v>=100?v.toFixed(0)+"×":v.toFixed(1)+"×" },
  nsb:{ label:"ns/byte", better:"lower", log:true, ramp:[...RAMP].reverse(),
    val:(X,m,c,e)=>{const r=X.get(m,c,e); return r&&!r.unsupported?r.ns_per_byte:null;},
    fmt:(v)=>v>=100?v.toFixed(0):v.toFixed(2) },
  tokps:{ label:"tokens/s", better:"higher", log:true, ramp:RAMP,
    val:(X,m,c,e)=>{const r=X.get(m,c,e);
      return r&&!r.unsupported&&r.mean_execution_time_seconds>0?r.total_tokens_produced/r.mean_execution_time_seconds:null;},
    fmt:(v)=>fmt.count(v) },
};

/* ---- chart plumbing ------------------------------------------------------ */
const AXIS={axisLine:{lineStyle:{color:"#232935"}},axisLabel:{color:"#8b95a7"},
  splitLine:{lineStyle:{color:"#1a1f28"}},splitArea:{show:false}};
const TOOLTIP={backgroundColor:"#171b22",borderColor:"#232935",borderWidth:1,
  textStyle:{color:"#e6e9ef",fontSize:12},padding:[8,10],confine:true};
let charts=[];
function mk(el,opt){ if(!el) return; const c=echarts.init(el,null,{renderer:"canvas"}); c.setOption(opt); charts.push(c); return c; }
window.addEventListener("resize",()=>charts.forEach(c=>c.resize()));

/* Distinct, stable colour per engine so a series keeps its identity across
   every chart on the page. */
const SERIES=["#5b8cff","#3ddc97","#ffb020","#c77dff","#ff7ab6","#4ecdc4","#ff6b6b","#a8e063","#7c8cff"];
function engColor(name){
  const i=X&&X.engines?X.engines.indexOf(name):-1;
  if(i>=0) return SERIES[i%SERIES.length];
  return SERIES[Math.abs([...name].reduce((h,c)=>h*31+c.charCodeAt(0)|0,7))%SERIES.length];
}

/**
 * Line chart across languages: x = corpus, one line per engine.
 *
 * Replaces the old heatmap. A line is easier to read than a colour: the eye
 * compares positions far better than shades, gaps show missing cells honestly,
 * and crossing lines make "engine A wins on Latin, loses on CJK" immediately
 * visible — which a grid of coloured squares never quite does.
 *
 * A HOLLOW marker means the ids disagree with the reference. The point is
 * still plotted, because hiding it would misrepresent coverage, but it is
 * visually demoted and the tooltip says so.
 */
function lineByCorpus(el, model, metric, compact){
  if(!el) return;
  const cols=X.corpora;
  const series=[];
  for(const eng of X.engines){
    const pts=cols.map(c=>{
      const r=X.get(model,c,eng);
      if(!r||r.unsupported) return null;
      if(S.hideBad&&r.verified===false) return null;
      const v=metric.val(X,model,c,eng);
      return v==null||!isFinite(v)?null:{value:v,_r:r};
    });
    if(pts.every(p=>p===null)) continue;
    const col=engColor(eng);
    series.push({
      name:eng,type:"line",connectNulls:false,symbolSize:compact?5:7,
      lineStyle:{width:compact?1.5:2.2,color:col},
      itemStyle:{color:col,
        // hollow = unverified/mismatched
        borderColor:col,borderWidth:2},
      symbol:"circle",
      data:pts.map(p=>p===null?null:({value:p.value,
        itemStyle:p._r.verified===false?{color:"#0b0d10",borderColor:col,borderWidth:2}:{color:col},
        _r:p._r})),
    });
  }
  if(!series.length){ el.innerHTML='<div class="empty">No engine ran this model.</div>'; return; }
  mk(el,{
    grid:{left:6,right:10,top:compact?26:44,bottom:6,containLabel:true},
    legend:compact?{show:false}:{data:series.map(s=>s.name),textStyle:{color:"#8b95a7"},
      top:0,itemWidth:14,itemHeight:10,type:"scroll"},
    tooltip:{...TOOLTIP,trigger:"axis",formatter(ps){
      const c=cols[ps[0].dataIndex];
      const body=ps.filter(p=>p.value!=null).sort((a,b)=>b.value-a.value).map(p=>{
        const r=p.data&&p.data._r;
        return `<div>${p.marker}${esc(p.seriesName)}: <b>${metric.fmt(p.value)}</b>`
          +(r&&r.verified===false?' <span style="color:#ff5c5c">✗ ids differ</span>':"")+`</div>`;
      }).join("");
      return `<b>${esc(model)} / ${esc(c)}</b><br>${body}`;
    }},
    // With ~30 corpora a compact panel cannot show every label legibly, so
    // thin them to at most ~8 and let the tooltip carry the exact corpus. The
    // full-size chart keeps all of them, rotated.
    xAxis:{type:"category",data:cols,boundaryGap:false,...AXIS,
      axisLabel:{...AXIS.axisLabel,rotate:cols.length>7?(compact?45:30):0,
        fontSize:compact?9:11,
        interval:compact?Math.max(0,Math.ceil(cols.length/8)-1):(cols.length>16?1:0),
        formatter:(v)=>compact&&v.length>10?v.slice(0,9)+"…":v}},
    yAxis:{type:metric.log?"log":"value",name:compact?"":metric.label,
      nameTextStyle:{color:"#8b95a7"},...AXIS,
      axisLabel:{...AXIS.axisLabel,fontSize:compact?9:11,formatter:(v)=>fmt.count(v)}},
    series,
  });
}

/**
 * 3D bars: x = language, y = engine, z = throughput.
 *
 * Needs echarts-gl. If it did not load, fall back to a grouped 2D bar of the
 * same data rather than leaving an empty panel — the information matters more
 * than the dimensionality.
 *
 * Height is log-scaled for the same reason the old colour scale was: the range
 * spans three orders of magnitude, and on a linear axis every engine except
 * the fastest is a flat smear on the floor.
 */
function bar3d(el, model, metric){
  if(!el) return;
  const cols=X.corpora, rows=X.engines.filter(e=>
    X.corpora.some(c=>{const r=X.get(model,c,e); return r&&!r.unsupported;}));
  if(!rows.length){ el.innerHTML='<div class="empty">No engine ran this model.</div>'; return; }

  // bar3D exists only if echarts-gl loaded AND the browser gives us WebGL.
  const gl = hasWebGL() && seriesTypeExists("bar3D");

  const data=[]; let vmin=Infinity, vmax=-Infinity;
  rows.forEach((e,yi)=>cols.forEach((c,xi)=>{
    const r=X.get(model,c,e); if(!r||r.unsupported) return;
    if(S.hideBad&&r.verified===false) return;
    const v=metric.val(X,model,c,e); if(v==null||!isFinite(v)) return;
    if(metric.log&&v<=0) return;
    vmin=Math.min(vmin,v); vmax=Math.max(vmax,v);
    // Index 2 is the plotted value -- the real number, with the axis doing the
    // log. Index 5 carries log10 for the colour ramp, which visualMap cannot
    // scale by itself.
    data.push([xi,yi,v,v,r.verified===false?1:0,Math.log10(Math.max(v,1e-6))]);
  }));
  if(!data.length){ el.innerHTML='<div class="empty">No data.</div>'; return; }

  if(!gl){
    // 2D fallback: grouped bars, engines as series.
    mk(el,{
      grid:{left:8,right:10,top:44,bottom:8,containLabel:true},
      legend:{data:rows,textStyle:{color:"#8b95a7"},top:0,itemWidth:14,itemHeight:10,type:"scroll"},
      tooltip:{...TOOLTIP,trigger:"axis",axisPointer:{type:"shadow"}},
      xAxis:{type:"category",data:cols,...AXIS,axisLabel:{...AXIS.axisLabel,rotate:30,fontSize:10}},
      yAxis:{type:metric.log?"log":"value",...AXIS,
        axisLabel:{...AXIS.axisLabel,formatter:(v)=>fmt.count(v)}},
      series:rows.map(e=>({name:e,type:"bar",barMaxWidth:14,itemStyle:{color:engColor(e)},
        data:cols.map(c=>{const r=X.get(model,c,e);
          if(!r||r.unsupported) return null;
          const v=metric.val(X,model,c,e); return v==null||!isFinite(v)?null:v;})})),
    });
    const n=document.createElement("div"); n.className="legend";
    n.innerHTML="<span>echarts-gl unavailable — showing the same data as grouped 2D bars</span>";
    el.parentElement.appendChild(n);
    return;
  }

  mk(el,{
    tooltip:{...TOOLTIP,formatter:(p)=>{
      const [xi,yi,,v,bad]=p.value;
      return `<b>${esc(rows[yi])}</b><br>${esc(model)} / ${esc(cols[xi])}<br>`
        +`${metric.fmt(v)} ${metric.label}`+(bad?'<div style="color:#ff5c5c">✗ ids differ from reference</div>':"");
    }},
    visualMap:{show:false,min:Math.log10(Math.max(vmin,1e-6)),max:Math.log10(Math.max(vmax,1e-6)),
      dimension:5,inRange:{color:["#153a5b","#0f6b63","#4ba64a","#c2b52e","#ff7a4d","#ff4d6d"]}},
    xAxis3D:{type:"category",data:cols,name:"language",
      axisLabel:{color:"#8b95a7",fontSize:10},nameTextStyle:{color:"#8b95a7"}},
    yAxis3D:{type:"category",data:rows,name:"engine",
      axisLabel:{color:"#8b95a7",fontSize:10},nameTextStyle:{color:"#8b95a7"}},
    // Log axis, real tick labels. Plotting log10 on a linear axis made a bar of
    // height 2 mean 100 MB/s, which no reader should have to decode.
    zAxis3D:{type:metric.log?"log":"value",name:metric.label,min:metric.log?undefined:0,
      axisLabel:{color:"#8b95a7",fontSize:10,formatter:(v)=>metric.fmt(v)},
      nameTextStyle:{color:"#8b95a7"}},
    grid3D:{boxWidth:260,boxDepth:130,boxHeight:110,
      viewControl:{alpha:20,beta:28,distance:290,autoRotate:false},
      axisLine:{lineStyle:{color:"#2a3140"}},
      axisPointer:{lineStyle:{color:"#5b8cff"}},
      splitLine:{lineStyle:{color:"#1a1f28"}},
      environment:"#0b0d10"},
    series:[{type:"bar3D",data,shading:"lambert",barSize:5,
      emphasis:{label:{show:false},itemStyle:{color:"#e6e9ef"}}}],
  });
}

let _webgl=null;
function hasWebGL(){
  if(_webgl!==null) return _webgl;
  try{
    const c=document.createElement("canvas");
    _webgl=!!(c.getContext("webgl2")||c.getContext("webgl"));
  }catch{ _webgl=false; }
  return _webgl;
}

/** True when echarts-gl registered the given series type. */
let _st={};
function seriesTypeExists(t){
  if(t in _st) return _st[t];
  try{
    const probe=document.createElement("div");
    probe.style.cssText="width:10px;height:10px;position:absolute;left:-9999px";
    document.body.appendChild(probe);
    const c=echarts.init(probe);
    let ok=true;
    try{ c.setOption({series:[{type:t,data:[]}]}); }catch{ ok=false; }
    // echarts logs but does not throw on an unknown series type, so also check
    // the model actually materialised.
    if(ok){ ok = !!(c.getModel && c.getModel().getSeriesByType &&
                    c.getModel().getSeriesByType(t).length>0); }
    c.dispose(); probe.remove();
    return ok;
  }catch{ return false; }
}

/** Grouped bar: engines within each model, median over languages. */
function groupedBar(el, metric, onClick){
  if(!el) return;
  const models=X.models;
  const series=X.engines.map(e=>({
    name:e,type:"bar",barMaxWidth:16,itemStyle:{color:engColor(e),borderRadius:[3,3,0,0]},
    data:models.map(m=>{
      const vs=[];
      for(const c of X.corpora){
        const r=X.get(m,c,e); if(!r||r.unsupported) continue;
        if(S.hideBad&&r.verified===false) continue;
        const v=metric.val(X,m,c,e); if(v!=null&&isFinite(v)) vs.push(v);
      }
      return vs.length?median(vs):null;
    }),
  })).filter(s=>s.data.some(v=>v!=null));
  if(!series.length){ el.innerHTML='<div class="empty">No data.</div>'; return; }
  const c=mk(el,{
    grid:{left:8,right:10,top:44,bottom:8,containLabel:true},
    legend:{data:series.map(s=>s.name),textStyle:{color:"#8b95a7"},top:0,
      itemWidth:14,itemHeight:10,type:"scroll"},
    tooltip:{...TOOLTIP,trigger:"axis",axisPointer:{type:"shadow"},formatter(ps){
      return `<b>${esc(models[ps[0].dataIndex])}</b><br>`
        +ps.filter(p=>p.value!=null).sort((a,b)=>b.value-a.value)
           .map(p=>`<div>${p.marker}${esc(p.seriesName)}: <b>${metric.fmt(p.value)}</b></div>`).join("");
    }},
    xAxis:{type:"category",data:models,...AXIS,axisLabel:{...AXIS.axisLabel,rotate:20,fontSize:11}},
    yAxis:{type:metric.log?"log":"value",name:`median ${metric.label}`,
      nameTextStyle:{color:"#8b95a7"},...AXIS,
      axisLabel:{...AXIS.axisLabel,formatter:(v)=>fmt.count(v)}},
    series,
  });
  if(c&&onClick) c.on("click",(p)=>onClick(models[p.dataIndex]));
}

/* ---- state --------------------------------------------------------------- */
let DATA=null, X=null;
const S={model:null,corpus:null,engine:null,metric:"mbps",hideBad:false,commonOnly:true};

/**
 * The cells every engine in `names` ran AND verified.
 *
 * Cross-engine medians must be computed over this set, not over each engine's
 * own cells. Engines cover different model families, so a per-engine median
 * silently rewards whichever one declines the hard cases: on this data,
 * ranking by own-cells median puts gigatoken (which skips WordPiece and
 * Unigram entirely) above pipeline, and the order reverses once both are held
 * to the same 12 cells.
 */
/**
 * Engines allowed into rankings despite mismatching ids.
 *
 * Deliberate and temporary. `pipeline` is an in-progress PR whose only
 * divergence is Unigram (all 8 of its mismatches are albert); the maintainer
 * wants its throughput tracked while that is being fixed. The exemption
 * suppresses only the EXCLUSION — the mismatch count is still shown in the
 * coverage table and the cells are still drawn as mismatched — so nothing is
 * hidden, it is just not filtered out.
 *
 * On the current data this changes no ranking, because the disputed cells sit
 * outside the common set anyway. That is worth knowing rather than assuming.
 */
const VERIFY_EXEMPT = new Set(["pipeline"]);
const counts = (r, name) =>
  !!r && !r.unsupported && (r.verified === true || VERIFY_EXEMPT.has(name));

function commonCells(names){
  let set=null;
  for(const n of names){
    const mine=new Set();
    for(const m of X.models) for(const c of X.corpora){
      if(counts(X.get(m,c,n), n)) mine.add(m+"|"+c);
    }
    set = set===null ? mine : new Set([...set].filter(k=>mine.has(k)));
    if(!set.size) break;
  }
  return set||new Set();
}

  buildTables(metric);

  // Small multiples: EVERY model at once, each with every language and every

  for(const m of X.models) lineByCorpus($(`#sm-${cssId(m)}`), m, metric, true);

/**
 * Multi-thread scaling. The sweep is only run on the corpora named with
 * `--scaling`, so this looks for whichever corpus of the selected model has
 * the data and says which one it used.
 */
function drawScaling(){
  const cor = X.corpora.find(c=>X.engines.some(e=>X.get(S.model,c,e)?.scaling?.length));
  const mtEl=$("#c-mt"), effEl=$("#c-mteff");
  if(!cor){
    const msg='<div class="empty">No scaling sweep in this run.<br><span style="font-size:12px">'
      +'Re-run with <code>--scaling &lt;corpus&gt;</code> (e.g. <code>--scaling english</code>).</span></div>';
    if(mtEl) mtEl.innerHTML=msg; if(effEl) effEl.innerHTML=msg; return;
  }
  // Only engines whose ids MATCH on this cell. A scaling curve for a different
  // id stream is a curve for a different computation — blingfire, for
  // instance, posts 93% efficiency on gpt2/english while producing none of the
  // whitespace tokens, so plotting it beside the others invites a false read.
  const hasCurve=(r)=>r&&!r.unsupported&&r.scaling?.length;
  const rows=X.engines.map(e=>X.get(S.model,cor,e))
    .filter(r=>hasCurve(r)&&(r.verified!==false||VERIFY_EXEMPT.has(r.tokenizer_name)));
  const dropped=X.engines.map(e=>X.get(S.model,cor,e))
    .filter(r=>hasCurve(r)&&r.verified===false&&!VERIFY_EXEMPT.has(r.tokenizer_name))
    .map(r=>r.tokenizer_name);
  if(!rows.length){ mtEl.innerHTML='<div class="empty">No scaling data for this model.</div>';
    effEl.innerHTML=mtEl.innerHTML; return; }

  const threads=[...new Set(rows.flatMap(r=>r.scaling.map(p=>p.threads)))].sort((a,b)=>a-b);
  const at=(r,n)=>r.scaling.find(p=>p.threads===n);

  // Ideal line: each engine's 1-thread rate times the thread count. Drawn once,
  // from the fastest engine, so the chart shows the ceiling without eight
  // near-identical dashed lines.
  const fastest=rows.reduce((a,b)=>(at(b,1)?.mbps??0)>(at(a,1)?.mbps??0)?b:a);
  const base1=at(fastest,1)?.mbps??0;

  mk(mtEl,{
    grid:{left:8,right:14,top:44,bottom:8,containLabel:true},
    legend:{data:[...rows.map(r=>r.tokenizer_name),"linear (ideal)"],textStyle:{color:"#8b95a7"},
      top:0,itemWidth:14,itemHeight:10,type:"scroll"},
    tooltip:{...TOOLTIP,trigger:"axis",formatter(ps){
      const n=threads[ps[0].dataIndex];
      const lines=ps.filter(p=>p.value!=null).map(p=>{
        const r=rows.find(x=>x.tokenizer_name===p.seriesName);
        const q=r?at(r,n):null;
        return `<div>${p.marker}${esc(p.seriesName)}: <b>${fmt.mbps(p.value)} MB/s</b>`
          +(q?` <span style="color:#8b95a7">(${q.efficiency_pct.toFixed(0)}% of linear)</span>`:"")+`</div>`;
      }).join("");
      return `<b>${n} thread${n>1?"s":""}</b><br>${lines}`;
    }},
    xAxis:{type:"category",data:threads,name:"threads",nameLocation:"middle",nameGap:26,
      nameTextStyle:{color:"#8b95a7"},...AXIS},
    yAxis:{type:"log",name:"MB/s",nameTextStyle:{color:"#8b95a7"},...AXIS,
      axisLabel:{...AXIS.axisLabel,formatter:(v)=>fmt.count(v)}},
    series:[
      ...rows.map(r=>({name:r.tokenizer_name,type:"line",smooth:false,symbolSize:6,
        lineStyle:{width:2,color:engColor(r.tokenizer_name)},itemStyle:{color:engColor(r.tokenizer_name)},
        data:threads.map(n=>at(r,n)?.mbps??null)})),
      {name:"linear (ideal)",type:"line",symbol:"none",
        lineStyle:{width:1.5,type:"dashed",color:"#5b6577"},
        data:threads.map(n=>base1*n)},
    ],
  });

  mk(effEl,{
    grid:{left:8,right:14,top:44,bottom:8,containLabel:true},
    legend:{data:rows.map(r=>r.tokenizer_name),textStyle:{color:"#8b95a7"},top:0,
      itemWidth:14,itemHeight:10,type:"scroll"},
    tooltip:{...TOOLTIP,trigger:"axis",formatter(ps){
      const n=threads[ps[0].dataIndex];
      return `<b>${n} thread${n>1?"s":""}</b><br>`+ps.filter(p=>p.value!=null).map(p=>{
        const r=rows.find(x=>x.tokenizer_name===p.seriesName), q=r?at(r,n):null;
        return `<div>${p.marker}${esc(p.seriesName)}: <b>${p.value.toFixed(0)}%</b>`
          +(q?` <span style="color:#8b95a7">${fmt.mbps(q.mbps)} MB/s</span>`:"")+`</div>`;
      }).join("");
    }},
    xAxis:{type:"category",data:threads,name:"threads",nameLocation:"middle",nameGap:26,
      nameTextStyle:{color:"#8b95a7"},...AXIS},
    yAxis:{type:"value",name:"% of linear",nameTextStyle:{color:"#8b95a7"},...AXIS,
      axisLabel:{...AXIS.axisLabel,formatter:"{value}%"}},
    series:rows.map((r,i)=>({name:r.tokenizer_name,type:"line",symbolSize:6,
      lineStyle:{width:2,color:engColor(r.tokenizer_name)},itemStyle:{color:engColor(r.tokenizer_name)},
      data:threads.map(n=>at(r,n)?.efficiency_pct??null),
      // One 100% guide line for the whole chart, on the first series only.
      markLine:i===0?{silent:true,symbol:"none",
        lineStyle:{color:"#3ddc97",type:"dashed",width:1.5},
        label:{formatter:"perfect linear",color:"#3ddc97",fontSize:10,position:"insideEndTop"},
        data:[{yAxis:100}]}:undefined})),
  });

  const note=document.createElement("div");
  note.className="legend";
  note.innerHTML=`<span>sweep corpus: <b style="color:var(--fg)">${esc(cor)}</b></span>
    <span>each thread gets its own engine instance; documents pulled from a shared queue</span>
    ${dropped.length?`<span style="color:var(--bad)">excluded (ids differ): ${dropped.map(esc).join(", ")}</span>`:""}`;
  effEl.parentElement.appendChild(note);
}

function cellRows(){
  return X.engines.map(e=>X.get(S.model,S.corpus,e)).filter(r=>r&&!r.unsupported);
}

function drawCell(){
  const rows=cellRows();
  // speed + efficiency
  const r=[...rows].sort((a,b)=>b.mbps-a.mbps);
  if(r.length) mk($("#c-speed"),{
    grid:{left:8,right:8,top:40,bottom:8,containLabel:true},
    legend:{data:["Tokens / second","ns per byte"],textStyle:{color:"#8b95a7"},top:0,itemWidth:12,itemHeight:12},
    tooltip:{...TOOLTIP,trigger:"axis",axisPointer:{type:"shadow"},formatter(ps){
      const x=r[ps[0].dataIndex];
      return `<b>${esc(x.tokenizer_name)}</b> <span style="color:#5b6577">${esc(x.engine_version||"")}</span><br>
        ${fmt.count(x.total_tokens_produced/x.mean_execution_time_seconds)} tok/S<br>
        ${x.ns_per_byte.toFixed(2)} ns/B · ${fmt.mbps(x.mbps)} MB/s<br>
        <span style="color:#8b95a7">${fmt.count(x.total_tokens_produced)} tokens in ${fmt.dur(x.mean_execution_time_seconds*1e9)}</span>
        ${x.also_computes?`<div style="color:#8b95a7">also computes: ${esc(x.also_computes)}</div>`:""}
        ${x.internally_parallel?'<div style="color:#ffb020">⚠ multi-threaded internally</div>':""}
        ${x.verified===false?'<div style="color:#ff5c5c">⚠ ids differ — not comparable</div>':""}`;
    }},
    xAxis:{type:"category",data:r.map(x=>x.tokenizer_name),...AXIS,
      axisLabel:{...AXIS.axisLabel,rotate:r.length>5?28:0,fontSize:11}},
    yAxis:[{type:"value",name:"tok/S",nameTextStyle:{color:"#8b95a7"},...AXIS,
        axisLabel:{...AXIS.axisLabel,formatter:(v)=>fmt.count(v)}},
      {type:"value",name:"ns/B",nameTextStyle:{color:"#8b95a7"},...AXIS,splitLine:{show:false}}],
    series:[
      {name:"Tokens / second",type:"bar",yAxisIndex:0,barMaxWidth:34,
        data:r.map(x=>({value:x.total_tokens_produced/x.mean_execution_time_seconds,
          itemStyle:{color:x.verified===false?"#7a2230":"#5b8cff",borderRadius:[3,3,0,0]}}))},
      {name:"ns per byte",type:"bar",yAxisIndex:1,barMaxWidth:34,
        data:r.map(x=>({value:x.ns_per_byte,
          itemStyle:{color:x.verified===false?"#5a4020":"#3ddc97",borderRadius:[3,3,0,0]}}))},
    ],
  }); else $("#c-speed").innerHTML='<div class="empty">No engine ran this cell.</div>';

  // phases
  const p=rows.filter(x=>x.breakdown_nanoseconds);
  if(!p.length) $("#c-phase").innerHTML='<div class="empty">No engine here reports a phase breakdown.<br>'
    +'<span style="font-size:12px">Only engines whose API exposes stages separately are instrumented; the rest are left blank rather than given an invented split.</span></div>';
  else {
    const tot=p.map(x=>PHASES.reduce((s,[k])=>s+(x.breakdown_nanoseconds[k]||0),0));
    mk($("#c-phase"),{
      grid:{left:8,right:22,top:40,bottom:8,containLabel:true},
      legend:{data:PHASES.map(x=>x[1]),textStyle:{color:"#8b95a7"},top:0,itemWidth:12,itemHeight:12},
      tooltip:{...TOOLTIP,trigger:"axis",axisPointer:{type:"shadow"},formatter(ps){
        const i=ps[0].dataIndex,x=p[i],t=tot[i];
        return `<b>${esc(x.tokenizer_name)}</b><br>`+PHASES.map(([k,l],j)=>{
          const ns=x.breakdown_nanoseconds[k]||0;
          return `<div><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${PHASE_COLORS[j]};margin-right:6px"></span>
            ${l}: <b>${(ns/t*100).toFixed(1)}%</b> <span style="color:#8b95a7">(${fmt.dur(ns)})</span></div>`;
        }).join("")+`<div style="color:#8b95a7;margin-top:4px">total ${fmt.dur(t)}</div>`;
      }},
      xAxis:{type:"value",max:100,...AXIS,axisLabel:{...AXIS.axisLabel,formatter:"{value}%"}},
      yAxis:{type:"category",data:p.map(x=>x.tokenizer_name),...AXIS,splitLine:{show:false}},
      series:PHASES.map(([k,l],j)=>({name:l,type:"bar",stack:"t",barMaxWidth:26,
        itemStyle:{color:PHASE_COLORS[j]},
        data:p.map((x,i)=>tot[i]?(x.breakdown_nanoseconds[k]||0)/tot[i]*100:0)})),
    });
  }

  // footprint — one row per engine, deduped across the matrix
  const seen=new Map();
  for(const r2 of X.cell.values()){
    if(r2.unsupported) continue;
    const k=r2.tokenizer_name;
    if(!seen.has(k)||(seen.get(k).heap_load_mb==null&&r2.heap_load_mb!=null)) seen.set(k,r2);
  }
  const f=[...seen.values()].filter(x=>x.crate_size_kb!=null||x.heap_load_mb!=null||x.rss_delta_mb!=null)
    .sort((a,b)=>(b.crate_size_kb||0)-(a.crate_size_kb||0));
  if(!f.length) $("#c-foot").innerHTML='<div class="empty">No footprint data.<br><span style="font-size:12px">Run <code>scripts/package_size.py</code>, and the driver without <code>--no-memory</code>.</span></div>';
  else mk($("#c-foot"),{
    grid:{left:8,right:22,top:40,bottom:8,containLabel:true},
    legend:{data:["Package size","Loaded tokenizer"],textStyle:{color:"#8b95a7"},top:0,itemWidth:12,itemHeight:12},
    tooltip:{...TOOLTIP,trigger:"axis",axisPointer:{type:"shadow"},formatter(ps){
      const x=f[ps[0].dataIndex];
      // RSS is shown as a secondary line, never as the headline. It is a
      // high-water mark: an engine that parses into hash maps, builds a compact
      // structure and frees the maps keeps those pages, so RSS bills it for
      // memory it no longer holds -- exactly inverting what a compact design buys.
      const built=(x.rss_delta_mb!=null&&x.heap_encode_mb!=null)?x.rss_delta_mb-x.heap_encode_mb:null;
      return `<b>${esc(x.tokenizer_name)}</b><br>package: <b>${fmt.kb(x.crate_size_kb)}</b>
        <span style="color:#5b6577">${esc(x.package_ref||"")}</span><br>
        loaded tokenizer: <b>${fmt.mb(x.heap_load_mb)}</b> live heap
        ${x.heap_encode_mb!=null?`<div style="color:#8b95a7">+${fmt.mb(x.heap_encode_mb-x.heap_load_mb)} of caches once warm</div>`:""}
        ${x.rss_delta_mb!=null?`<div style="color:#8b95a7">RSS ${fmt.mb(x.rss_delta_mb)}${built!=null?` — of which ${fmt.mb(built)} is freed during build but stays resident`:""}</div>`:""}
        ${x.binary_delta_kb!=null?`<div style="color:#8b95a7">adds ${fmt.kb(x.binary_delta_kb)} to a binary (gzipped)</div>`:""}`;
    }},
    xAxis:[{type:"value",name:"package kB",nameTextStyle:{color:"#8b95a7"},...AXIS,
        axisLabel:{...AXIS.axisLabel,formatter:(v)=>fmt.count(v)}},
      {type:"value",name:"live heap MB",nameTextStyle:{color:"#8b95a7"},...AXIS,splitLine:{show:false}}],
    yAxis:{type:"category",data:f.map(x=>x.tokenizer_name),...AXIS,splitLine:{show:false}},
    series:[
      {name:"Package size",type:"bar",xAxisIndex:0,barMaxWidth:15,itemStyle:{color:"#c77dff",borderRadius:[0,3,3,0]},
        data:f.map(x=>x.crate_size_kb??0)},
      {name:"Loaded tokenizer",type:"bar",xAxisIndex:1,barMaxWidth:15,itemStyle:{color:"#ff7ab6",borderRadius:[0,3,3,0]},
        data:f.map(x=>x.heap_load_mb??0)},
    ],
  });
}

/* ---- sortable tables ----------------------------------------------------- */
/* Every table sorts on every column. Sorting re-renders only that table's
   markup, never the charts: redrawing seven small multiples and a WebGL scene
   to reorder some rows would make a click feel broken. */

const SORT={ summary:{key:"med",dir:-1} };
const TABLES={};

const cssId=(s)=>String(s).replace(/[^a-zA-Z0-9_-]/g,"_");

function renderTable(id){
  const t=TABLES[id]; if(!t) return "";
  const st=SORT[id];
  const rows=[...t.rows].sort((a,b)=>{
    const A=a[st.key], B=b[st.key];
    // Nulls sink to the bottom in both directions — an engine that did not run
    // should never top the table just because the sort flipped.
    if(A==null&&B==null) return 0;
    if(A==null) return 1;
    if(B==null) return -1;
    if(typeof A==="string"||typeof B==="string")
      return st.dir*String(A).localeCompare(String(B));
    return st.dir*(A-B);
  });
  const head=t.cols.map(c=>{
    const on=st.key===c.key;
    return `<th class="sortable${on?" sorted":""}" data-t="${id}" data-k="${c.key}" title="sort by ${esc(c.label)}">`
      +`${c.label}<span class="arrow">${on?(st.dir>0?"▲":"▼"):"↕"}</span></th>`;
  }).join("");
  const body=rows.map(r=>`<tr>${t.cols.map(c=>c.cell(r)).join("")}</tr>`).join("");
  return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

function paintTable(id){
  const host=$(`#tbl-${id}`); if(host) host.innerHTML=renderTable(id);
}

function buildTables(metric){
  const num=(v,f)=>`<td class="num">${v==null?"—":f(v)}</td>`;
  // Cross-engine aggregates are computed over the cells every engine verified,
  // unless the user turns that off. See commonCells().
  const ranked=X.engines.filter(e=>{
    for(const m of X.models) for(const c of X.corpora){
      if(counts(X.get(m,c,e), e)) return true;
    }
    return false;
  });
  const common=S.commonOnly?commonCells(ranked):null;
  const inScope=(m,c)=>!common||common.has(m+"|"+c);
  const idBadge=(v)=>v===true?'<span class="badge b-ok">match</span>'
    :v===false?'<span class="badge b-bad">differ</span>':'<span class="badge b-dim">—</span>';

  // --- per-engine aggregate over the whole matrix ---
  const ref=(m,c)=>{const r=X.get(m,c,REF); return r&&!r.unsupported?r.mbps:null;};
  const summary=X.engines.map(e=>{
    const cells=[], sp=[];
    let ok=0, bad=0, unsup=0, rss=[], pkg=null, bin=null, cls="", lang="", ver="";
    for(const m of X.models) for(const c of X.corpora){
      const r=X.get(m,c,e); if(!r) continue;
      if(r.unsupported){ unsup++; continue; }
      if(!inScope(m,c)) continue;
      cells.push(r.mbps);
      if(r.verified===true) ok++; else if(r.verified===false) bad++;
      // Live heap, not RSS: see the footprint tooltip for why RSS inverts the ranking.
      if(r.heap_load_mb!=null) rss.push(r.heap_load_mb); else if(r.rss_delta_mb!=null) rss.push(r.rss_delta_mb);
      if(pkg==null&&r.crate_size_kb!=null) pkg=r.crate_size_kb;
      if(bin==null&&r.binary_delta_kb!=null) bin=r.binary_delta_kb;
      cls=cls||r.engine_class; lang=lang||r.engine_lang; ver=ver||r.engine_version;
      const b=ref(m,c);
      if(b&&r.verified===true) sp.push(r.mbps/b);
    }
    return {engine:e, lang, ver, cls, ran:cells.length, ok, bad, unsup,
      med:cells.length?median(cells):null,
      max:cells.length?Math.max(...cells):null,
      speedup:sp.length?median(sp):null,
      rss:rss.length?median(rss):null, pkg, bin};
  }).filter(r=>r.ran||r.unsup);

  TABLES.summary={rows:summary, cols:[
    {key:"engine",label:"Engine",cell:r=>`<td><b>${esc(r.engine)}</b>
      <span style="color:var(--dim);font-size:11px">${esc(r.lang||"")}</span>
      ${r.ver?`<div style="color:var(--dim);font-size:11px;white-space:normal;max-width:340px">${esc(r.ver)}</div>`:""}</td>`},
    {key:"ran",label:"Cells",cell:r=>num(r.ran,v=>v)},
    {key:"ok",label:"IDs match",cell:r=>`<td class="num" style="color:var(--ok)">${r.ok||"—"}</td>`},
    {key:"bad",label:"IDs differ",cell:r=>`<td class="num" style="color:${r.bad?"var(--bad)":"var(--dim)"}">${r.bad||"—"}</td>`},
    {key:"unsup",label:"Unsupported",cell:r=>`<td class="num" style="color:var(--dim)">${r.unsup||"—"}</td>`},
    {key:"med",label:"Median MB/s",cell:r=>num(r.med,fmt.mbps)},
    {key:"max",label:"Max MB/s",cell:r=>num(r.max,fmt.mbps)},
    {key:"speedup",label:"× vs ref",cell:r=>num(r.speedup,v=>v>=100?v.toFixed(0)+"×":v.toFixed(1)+"×")},
    {key:"rss",label:"RAM",cell:r=>num(r.rss,fmt.mb)},
    {key:"pkg",label:"Package",cell:r=>num(r.pkg,fmt.kb)},
    {key:"bin",label:"+binary gz",cell:r=>num(r.bin,fmt.kb)},
    {key:"cls",label:"Class",cell:r=>`<td><span class="badge ${r.cls==="native"?"b-ok":r.cls==="subprocess"?"b-warn":"b-dim"}">${esc(r.cls||"?")}</span></td>`},
  ]};

  paintTable("summary");
}

function wire(){
  $("#metricseg").addEventListener("click",(e)=>{
    const b=e.target.closest("button"); if(!b) return; S.metric=b.dataset.m; render();
  });
  $("#selmodel").onchange=(e)=>{S.model=e.target.value;render();};
  $("#selcorpus").onchange=(e)=>{S.corpus=e.target.value;render();};
  $("#selengine").onchange=(e)=>{S.engine=e.target.value;render();};
  $("#hidebad").onclick=()=>{S.hideBad=!S.hideBad;render();};
  $("#commononly").onclick=()=>{S.commonOnly=!S.commonOnly;render();};

  // Header clicks: same column flips direction, a new column starts descending
  // (for numbers the interesting end is almost always the top).
  document.querySelectorAll("th.sortable").forEach(th=>{
    th.onclick=()=>{
      const id=th.dataset.t, k=th.dataset.k, st=SORT[id];
      if(st.key===k) st.dir=-st.dir; else { st.key=k; st.dir=-1; }
      paintTable(id);
      wire();           // the new headers need their handlers
    };
  });

  // Small-multiple titles focus that model.
  document.querySelectorAll(".sm-title").forEach(t=>{
    t.onclick=()=>{ S.model=t.dataset.model; render(); };
  });
}

/* ---- input --------------------------------------------------------------- */
function load(o,label){
  DATA=o;
  const a=o?.aggregation;
  $("#loaded").textContent=a?.complete_reports
    ? `median of ${a.complete_reports} complete runs · ${label}` : label;
  render();
}
function readFile(f){
  const rd=new FileReader();
  rd.onload=()=>{ try{ load(JSON.parse(rd.result),`${f.name} · ${(f.size/1024).toFixed(0)} kB`); }
    catch(e){ $("#app").innerHTML=`<div class="notice bad">Could not parse <b>${esc(f.name)}</b>: ${esc(e.message)}</div>`; } };
  rd.readAsText(f);
}
const drop=$("#drop");
["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("hot");}));
["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("hot");}));
drop.addEventListener("drop",e=>{const f=e.dataTransfer.files?.[0];if(f)readFile(f);});
$("#file").addEventListener("change",e=>{if(e.target.files[0])readFile(e.target.files[0]);});

/* Sample data: a small matrix with the honest edge cases in it — an
   unsupported engine, an id mismatch on Unigram, an uninstrumented breakdown —
   so the layout can be judged before a real run exists. */
const MOCK=(()=>{
  const models=["gpt2","llama-3","albert"], corpora=["english","chinese","code","thai","arabic"];
  const base={ "hf-tokenizers":11, "pipeline":500, "tokie":70, "tiktoken":31, "mistral-common":13 };
  const runs=[];
  for(const m of models) for(const c of corpora){
    const bytes=200000, results=[];
    for(const [name,b] of Object.entries(base)){
      if(name==="tiktoken"&&m==="albert"){ results.push({tokenizer_name:name,unsupported:"tiktoken has no Unigram"}); continue; }
      if(name==="mistral-common"&&m!=="llama-3"){ results.push({tokenizer_name:name,unsupported:"no tekken.json"}); continue; }
      const scale={english:1,chinese:.45,code:.8,thai:.5,arabic:.6}[c]*(m==="albert"?.25:m==="llama-3"?1.2:1);
      const mbps=b*scale, secs=(bytes/(1024*1024))/mbps;
      const badIds=(name==="pipeline"||name==="tokie")&&m==="albert";
      results.push({tokenizer_name:name,total_tokens_produced:Math.round(bytes/4.2),
        mean_execution_time_seconds:secs,mbps,ns_per_byte:secs*1e9/bytes,
        engine_version:name,engine_lang:name==="mistral-common"?"python":"rust",
        engine_class:name==="mistral-common"?"subprocess":"native",
        also_computes:name==="hf-tokenizers"?"byte offsets, word ids, attention mask":"",
        internally_parallel:false,load_ms:name==="hf-tokenizers"?74:40,
        ids_hash:badIds?"deadbeef":"47cdd139",verified:name===REF?true:!badIds,
        rss_delta_mb:{ "hf-tokenizers":35,"pipeline":33,"tokie":43,"tiktoken":12,"mistral-common":58 }[name],
        crate_size_kb:{ "hf-tokenizers":191.6,"pipeline":null,"tokie":181,"tiktoken":3699.4,"mistral-common":6400 }[name],
        package_ref:name==="tokie"?"tokie 0.1.4 (crates.io)":"",
        ...(name==="hf-tokenizers"?{breakdown_nanoseconds:{normalization:1500,pre_tokenization:90525501,core_encoding:30660291,post_processing:13704329}}:{}),
        // Scaling only on the corpus the sweep was asked for, as in a real run.
        // Efficiency decays differently per engine on purpose: that contrast is
        // the whole point of the chart.
        ...(c==="english"?{scaling:[1,2,4,8].map(n=>{
          const eff={ "hf-tokenizers":[100,72,48,29],"pipeline":[100,96,91,84],"tokie":[100,93,85,74],
                      "tiktoken":[100,88,76,61],"mistral-common":[100,55,31,18] }[name][[1,2,4,8].indexOf(n)];
          return {threads:n,mbps:mbps*n*eff/100,efficiency_pct:eff};
        })}:{})});
    }
    runs.push({dataset_metadata:{file_size_bytes:bytes,total_characters:bytes,corpus:c,model:m,reps:5,warmup:true},results});
  }
  return {dataset_metadata:runs[0].dataset_metadata,results:runs[0].results,runs};
})();
$("#demo").addEventListener("click",()=>load(structuredClone(MOCK),"sample data (not a real measurement)"));

/* Auto-load the results sitting next to this page. Only works when the page is
   served over http (a file:// page cannot fetch a sibling file — browsers treat
   every local file as its own origin). Falls back silently to the drop zone,
   which is the only option for a file:// open. `make dash` serves and opens. */
(async ()=>{
  if(location.protocol==="file:") return;
  try{
    const res=await fetch("tokenizer_bench_results.json",{cache:"no-store"});
    if(!res.ok) return;
    const j=await res.json();
    load(j,"tokenizer_bench_results.json (auto-loaded)");
  }catch{ /* no results yet — the drop zone stands */ }
})();
