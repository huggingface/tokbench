name: bench

# `check` is the correctness gate and runs on every push. `bench` does not run
# on pull requests: throughput measured on a shared cloud VM moves ~30% between
# runs, and a number that looks authoritative but is not is worse than none.
# Reproducible numbers come from `hf-jobs/`.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    permissions:
      contents: read
    name: build + verify protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The harness owns the definition of a fair measurement, so its own tests
      # are the thing that must never regress.
      - name: core harness tests
        run: cargo test -p tokbench-core

      - name: build all Rust engines
        run: cargo check -p tokbench --features rust-engines --all-targets

      - name: clippy
        run: cargo clippy -p tokbench-core -p tokbench --features rust-engines --all-targets -- -D warnings

      - name: fmt
        run: cargo fmt --all -- --check

  bench:
    permissions:
      contents: read
    name: measure
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Fetch corpora and model artifacts
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: make fixtures models

      - name: Package sizes
        run: python3 scripts/package_size.py

      - name: Binary size per engine
        run: bash scripts/binsize.sh || echo "binsize failed; column omitted"

      - name: Run the matrix
        run: cargo run --release -p tokbench --features rust-engines -- --reps 5

      # An id mismatch means two engines computed different things. That is a
      # correctness signal, not a performance one, so it fails the job.
      - name: Fail on id mismatches
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open("tokenizer_bench_results.json"))
          bad = [f"{r_.get('model','?')}/{r_.get('corpus','?')} {e['tokenizer_name']}"
                 for run in d.get("runs", [])
                 for r_ in [run["dataset_metadata"]]
                 for e in run["results"] if e.get("verified") is False]
          if bad:
              sys.exit("ids diverge from the reference: " + ", ".join(bad))
          print("all measured engines agree with the reference")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: results
          path: |
            tokenizer_bench_results.json
            package_sizes.json
            binary_sizes.json
          retention-days: 30
